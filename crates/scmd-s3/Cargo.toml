[package]
name = "scmd-s3"
description = "SupremeCommander: object storage — S3 and the services that speak its protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
scmd-core = { workspace = true }
# The job engine's filesystem for `s3://` paths lives here rather than in the engine: the
# engine knows nothing about object storage, and `ObjectFs` is the layer that keeps it so.
scmd-jobs = { workspace = true }
scmd-vfs = { workspace = true }
async-trait = "0.1"
# The signature is HMAC-SHA256 over a canonical request, and `ring` is already in the tree
# under the SSH client, so signing costs no new dependency.
ring = "0.17"
thiserror = "2"
tokio = { version = "1", features = ["rt", "io-util", "time", "macros", "fs"] }
# `ReaderStream`, so an upload's body streams off the disk instead of being held in memory.
# Already in the tree under `reqwest`, so it costs no new crate.
tokio-util = { version = "0.7", default-features = false, features = ["io"] }

[dependencies.reqwest]
version = "0.12"
default-features = false
# `rustls` rather than the platform's TLS — one implementation on every system, and no
# `default-tls`, which would want OpenSSL on Linux and a C toolchain with it. The trust
# anchors, though, are the machine's own: an S3-compatible endpoint inside a company is very
# often a MinIO or a Ceph behind that company's certificate authority, and a bundled root list
# cannot be told about it. With the system store, the endpoint works as soon as the machine
# trusts it, which it already does for every other tool. (It also keeps `webpki-roots` out of
# the tree, whose licence for the Mozilla root data is not one `deny.toml` allows.)
features = ["rustls-tls-native-roots", "http2", "stream", "socks"]
#
# Not 0.13, and not for want of trying: there the rustls support is built on
# `rustls-platform-verifier`, which carries `webpki-root-certs` — the Mozilla root data again,
# under CDLA-Permissive-2.0, which is exactly the licence this crate was moved off
# `webpki-roots` to avoid. It is not an optional dependency there, so no combination of
# features gets round it; `cargo deny` refuses the tree, and rightly. Revisit when
# `rustls-platform-verifier` stops carrying it.

[features]
# The in-process S3 service, for the tests of the crates above this one.
fake = []

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
