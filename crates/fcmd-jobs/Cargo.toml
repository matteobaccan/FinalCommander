[package]
name = "fcmd-jobs"
description = "FinalCommander: the file operation engine (plan, execute, settle)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
fcmd-arc = { workspace = true }
fcmd-core = { workspace = true }
# The system's own copy routine, behind `general.system_copy`: every call that needs
# `unsafe` or a `#[cfg]` lives in that crate, which is the rule the workspace is built on.
fcmd-platform = { workspace = true }
regex = "1"
thiserror = "2"
# The wastebasket, sending to it and — since the undo of 0.39.0 — listing and restoring from
# it. The features are named rather than taken by default so that the D-Bus `portal` backend,
# which would bring zbus, stays out: `freedesktop` is the Linux and BSD backend (a feature of
# its own since 5.3), `chrono` gives a trashed item its real deletion time there, which the
# undo needs to pick the newest of two items with one name (without it the time is a
# placeholder), and `coinit_apartmentthreaded` has to stay: on Windows the crate initialises
# COM and refuses to compile, on purpose, unless it is told which threading model to use.
# chrono is in the tree already through fcmd-ui.
trash = { version = "5.3.0", default-features = false, features = [
  "coinit_apartmentthreaded",
  "freedesktop",
  "chrono",
] }
# CRC32 for the `.sfv` lists, which is the one check those still use. Already in the tree
# under `zip` and `tar`, so it costs nothing to build; named here because this crate calls it.
crc32fast = "1"
md5 = "0.8"
sha1 = "0.11"
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"
# Only to build the archive a test then reads through the engine.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
