# Midnight Commander profile: the FAR baseline plus the mc habits people actually press.
name = "mc"
inherit = "far"

# mc hides dotfiles with Alt+. (Ctrl+H stays bound too, from the base profile).
[[bind]]
keys = ["Alt+."]
cmd = "panel.hidden.toggle"

# mc selects with + and deselects with backslash.
[[bind]]
keys = ["\\"]
cmd = "sel.mask.remove"

# mc: make the other panel show this directory.
[[bind]]
keys = ["Alt+O"]
cmd = "panel.other.sync"

# mc: find file.
[[bind]]
keys = ["Alt+?"]
cmd = "tool.find"

# mc: quick cd.
[[bind]]
keys = ["Alt+C"]
cmd = "nav.goto.path"

# mc cycles listing formats with Alt+T; we map it to the next view mode.
[[bind]]
keys = ["Alt+L"]
cmd = "panel.view.set(brief)"

[[bind]]
keys = ["Alt+F"]
cmd = "panel.view.set(full)"

# mc reaches the info panel and the quick view through `Ctrl+x i` and `Ctrl+x q`, which are
# chords we do not have; FAR's keys serve in both profiles.
[[bind]]
keys = ["Ctrl+L"]
cmd = "panel.info"

[[bind]]
keys = ["Ctrl+Q"]
cmd = "panel.quickview"

[[bind]]
keys = ["Ctrl+T"]
cmd = "panel.tree"

# In a multi-column view these move by a column, as they do in FAR; in the tree panel they
# expand and collapse.
[[bind]]
keys = ["Left"]
scope = "panel"
cmd = "nav.left"

[[bind]]
keys = ["Right"]
scope = "panel"
cmd = "nav.right"

# Bytes instead of lines, and back. `F4` already opens a binary this way; this is for the
# times the guess was wrong, either way round.
[[bind]]
keys = ["Alt+H"]
scope = "editor"
cmd = "editor.hex.toggle"

# A block of bytes: the same key Hiew marks one with.
[[bind]]
keys = ["F3"]
scope = "editor"
cmd = "editor.block.mark"

# What to do with the marked bytes. Hiew's own key for it.
[[bind]]
keys = ["F12"]
scope = "editor"
cmd = "editor.block.ops"

# One instruction, assembled where the cursor is. Hiew's own key for it.
[[bind]]
keys = ["F9"]
scope = "editor"
cmd = "editor.assemble"

# The calculator, on the key that looks like one.
[[bind]]
keys = ["Alt+="]
scope = "global"
cmd = "tool.calculator"
