# Default keymap: FAR Manager grammar, adapted to what terminals can actually deliver.
# See docs/03-keymap.md (§9 explains every deviation).
name = "far"

# ---------------------------------------------------------------- function keys
[[bind]]
keys = ["F1"]
scope = "global"
cmd = "app.help"

[[bind]]
keys = ["F2"]
cmd = "tool.usermenu"

[[bind]]
keys = ["F3"]
cmd = "file.view"

[[bind]]
keys = ["F4"]
cmd = "file.edit"

[[bind]]
keys = ["Shift+F4"]
cmd = "file.edit.new"

[[bind]]
keys = ["Alt+N"]
scope = "panel"
cmd = "net.sites"

[[bind]]
keys = ["Alt+Shift+N"]
scope = "panel"
cmd = "net.disconnect"

[[bind]]
keys = ["F5"]
cmd = "file.copy"

[[bind]]
keys = ["F6"]
cmd = "file.move"

[[bind]]
keys = ["F7"]
cmd = "file.mkdir"

[[bind]]
keys = ["F8", "Del"]
cmd = "file.delete"

[[bind]]
keys = ["Shift+F1"]
cmd = "file.pack"

[[bind]]
keys = ["Shift+F2"]
cmd = "file.unpack"

# The line between the panels, and how much of the screen they take. FAR's own keys: the
# rows the panels give up go to the user screen, which is what makes watching a command's
# output possible without leaving the panels at all.
[[bind]]
keys = ["Ctrl+Left"]
scope = "panel"
cmd = "panel.split(-1)"

[[bind]]
keys = ["Ctrl+Right"]
scope = "panel"
cmd = "panel.split(1)"

[[bind]]
keys = ["Ctrl+Up"]
scope = "panel"
cmd = "panel.height(-1)"

[[bind]]
keys = ["Ctrl+Down"]
scope = "panel"
cmd = "panel.height(1)"

# What can be done with the archive under the cursor, as a menu — MultiArc's `ArcCmd`.
[[bind]]
keys = ["Shift+F3"]
cmd = "arc.commands"

# FAR's `Group` and `SelUp`: the two parts of the order that are not the sort key itself.
[[bind]]
keys = ["Shift+F11"]
cmd = "panel.dirs.first"

[[bind]]
keys = ["Shift+F12"]
cmd = "panel.selected.first"

[[bind]]
keys = ["F9"]
scope = "global"
cmd = "app.menu"

[[bind]]
keys = ["Shift+F9"]
scope = "global"
cmd = "app.setup.save"

[[bind]]
keys = ["F10"]
scope = "global"
cmd = "app.quit"

[[bind]]
keys = ["Alt+F7"]
cmd = "tool.find"

# ---------------------------------------------------------------- panel control
[[bind]]
keys = ["Tab"]
cmd = "panel.focus.toggle"

[[bind]]
keys = ["Ctrl+U"]
cmd = "panel.swap"

[[bind]]
keys = ["Ctrl+R"]
cmd = "panel.reread"

[[bind]]
keys = ["Ctrl+H"]
cmd = "panel.hidden.toggle"

[[bind]]
keys = ["Ctrl+="]
cmd = "panel.other.sync"

[[bind]]
keys = ["Alt+I"]
cmd = "panel.filter.quick"

# FAR's own numbering: brief, medium, full, wide, detailed.
[[bind]]
keys = ["Ctrl+1"]
cmd = "panel.view.set(brief)"

[[bind]]
keys = ["Ctrl+2"]
cmd = "panel.view.set(medium)"

[[bind]]
keys = ["Ctrl+3"]
cmd = "panel.view.set(full)"

[[bind]]
keys = ["Ctrl+4"]
cmd = "panel.view.set(wide)"

[[bind]]
keys = ["Ctrl+5"]
cmd = "panel.view.set(detail)"

[[bind]]
keys = ["Ctrl+F3"]
cmd = "panel.sort.by(name)"

[[bind]]
keys = ["Ctrl+F4"]
cmd = "panel.sort.by(ext)"

[[bind]]
keys = ["Ctrl+F5"]
cmd = "panel.sort.by(mtime)"

[[bind]]
keys = ["Ctrl+F6"]
cmd = "panel.sort.by(size)"

[[bind]]
keys = ["Ctrl+F7"]
cmd = "panel.sort.by(none)"

# FAR's own two: a filesystem that does not keep the field sorts those entries together at
# the old end rather than failing (see docs/spec/02-panels.md §4).
[[bind]]
keys = ["Ctrl+F8"]
cmd = "panel.sort.by(btime)"

[[bind]]
keys = ["Ctrl+F9"]
cmd = "panel.sort.by(atime)"

# FAR opens the sort list on Ctrl+F12; reversing is a choice inside it, so the direct
# toggle moves one key further out.
[[bind]]
keys = ["Ctrl+F12"]
cmd = "panel.sort.menu"

[[bind]]
keys = ["Ctrl+Shift+F12"]
cmd = "panel.sort.reverse"

# ---------------------------------------------------------------- navigation
[[bind]]
keys = ["Up"]
cmd = "nav.up"

[[bind]]
keys = ["Down"]
cmd = "nav.down"

[[bind]]
keys = ["PgUp"]
cmd = "nav.pageup"

[[bind]]
keys = ["PgDn"]
cmd = "nav.pagedown"

[[bind]]
keys = ["Home"]
cmd = "nav.top"

[[bind]]
keys = ["End"]
cmd = "nav.bottom"

[[bind]]
keys = ["Enter"]
cmd = "nav.enter"

[[bind]]
keys = ["Ctrl+PgUp", "Backspace"]
cmd = "nav.parent"

[[bind]]
keys = ["Ctrl+\\"]
cmd = "nav.root"

[[bind]]
keys = ["Alt+Left"]
cmd = "nav.history.back"

[[bind]]
keys = ["Alt+Right"]
cmd = "nav.history.forward"

# FAR's `Ctrl+L` is the info panel, and now that `cd` works on the command line the
# change-directory dialog does not need the better key: it moves to `Ctrl+Shift+L`.
[[bind]]
keys = ["Ctrl+L"]
cmd = "panel.info"

[[bind]]
keys = ["Ctrl+Shift+L"]
cmd = "nav.goto.path"

# Folder shortcuts (SPEC 02 §11). FAR sets them with `Ctrl+Shift+0..9` and goes to them with
# `RightCtrl+0..9`, and no terminal can tell the two control keys apart (docs/03-keymap.md §9),
# so going to one is `Alt+0..9` — which is also Total Commander's key for its own tab list, and
# free here. `Ctrl+D` opens the whole hotlist, as Total Commander does.
[[bind]]
keys = ["Ctrl+D"]
scope = "panel"
cmd = "nav.bookmarks"

[[bind]]
keys = ["Ctrl+Shift+0"]
scope = "panel"
cmd = "nav.bookmark.set(0)"

[[bind]]
keys = ["Ctrl+Shift+1"]
scope = "panel"
cmd = "nav.bookmark.set(1)"

[[bind]]
keys = ["Ctrl+Shift+2"]
scope = "panel"
cmd = "nav.bookmark.set(2)"

[[bind]]
keys = ["Ctrl+Shift+3"]
scope = "panel"
cmd = "nav.bookmark.set(3)"

[[bind]]
keys = ["Ctrl+Shift+4"]
scope = "panel"
cmd = "nav.bookmark.set(4)"

[[bind]]
keys = ["Ctrl+Shift+5"]
scope = "panel"
cmd = "nav.bookmark.set(5)"

[[bind]]
keys = ["Ctrl+Shift+6"]
scope = "panel"
cmd = "nav.bookmark.set(6)"

[[bind]]
keys = ["Ctrl+Shift+7"]
scope = "panel"
cmd = "nav.bookmark.set(7)"

[[bind]]
keys = ["Ctrl+Shift+8"]
scope = "panel"
cmd = "nav.bookmark.set(8)"

[[bind]]
keys = ["Ctrl+Shift+9"]
scope = "panel"
cmd = "nav.bookmark.set(9)"

[[bind]]
keys = ["Alt+0"]
scope = "panel"
cmd = "nav.bookmark.go(0)"

[[bind]]
keys = ["Alt+1"]
scope = "panel"
cmd = "nav.bookmark.go(1)"

[[bind]]
keys = ["Alt+2"]
scope = "panel"
cmd = "nav.bookmark.go(2)"

[[bind]]
keys = ["Alt+3"]
scope = "panel"
cmd = "nav.bookmark.go(3)"

[[bind]]
keys = ["Alt+4"]
scope = "panel"
cmd = "nav.bookmark.go(4)"

[[bind]]
keys = ["Alt+5"]
scope = "panel"
cmd = "nav.bookmark.go(5)"

[[bind]]
keys = ["Alt+6"]
scope = "panel"
cmd = "nav.bookmark.go(6)"

[[bind]]
keys = ["Alt+7"]
scope = "panel"
cmd = "nav.bookmark.go(7)"

[[bind]]
keys = ["Alt+8"]
scope = "panel"
cmd = "nav.bookmark.go(8)"

[[bind]]
keys = ["Alt+9"]
scope = "panel"
cmd = "nav.bookmark.go(9)"

[[bind]]
keys = ["Ctrl+Q"]
cmd = "panel.quickview"

[[bind]]
keys = ["Ctrl+T"]
cmd = "panel.tree"

# Tabs (SPEC 02 §1.6). FAR has none, so there is no key of FAR's to keep: Total Commander's
# `Ctrl+T` is the tree panel here, and `Ctrl+Tab` steps between the open screens. That
# leaves the `Ctrl+Alt` row, which is also where the terminal lives — and not `Ctrl+Alt` with
# an arrow, which most desktops take for themselves before a terminal ever sees it.
[[bind]]
keys = ["Ctrl+Alt+T"]
scope = "panel"
cmd = "panel.tab.new"

[[bind]]
keys = ["Ctrl+Alt+W"]
scope = "panel"
cmd = "panel.tab.close"

[[bind]]
keys = ["Ctrl+Alt+N"]
scope = "panel"
cmd = "panel.tab.next"

[[bind]]
keys = ["Ctrl+Alt+P"]
scope = "panel"
cmd = "panel.tab.prev"

[[bind]]
keys = ["Ctrl+Alt+M"]
scope = "panel"
cmd = "panel.tab.move"

# `Ctrl+Alt+K`, and not `L` for lock: that one locks the screen on most desktops.
[[bind]]
keys = ["Ctrl+Alt+K"]
scope = "panel"
cmd = "panel.tab.lock"

# In a multi-column view these move by a column, as they do in FAR; in the tree panel they
# expand and collapse.
[[bind]]
keys = ["Left"]
scope = "panel"
cmd = "nav.left"

[[bind]]
keys = ["Right"]
scope = "panel"
cmd = "nav.right"

# ---------------------------------------------------------------- selection
[[bind]]
keys = ["Ins"]
cmd = "sel.toggle"

# FAR's own: Shift with the grey keys selects or clears everything. `Ctrl+Shift+A` is kept
# for `sel.all` because `Ctrl+A` is the attributes dialog, as it is in FAR, and because a
# terminal that does not report `Shift` with a printable key still needs a way to say it.
[[bind]]
keys = ["Shift++", "Ctrl+Shift+A"]
cmd = "sel.all"

[[bind]]
keys = ["Shift+-"]
cmd = "sel.none"

[[bind]]
keys = ["*"]
cmd = "sel.invert"

[[bind]]
keys = ["+"]
cmd = "sel.mask.add"

[[bind]]
keys = ["-"]
cmd = "sel.mask.remove"

# FAR uses Ctrl+M, which a terminal delivers as Enter: Ctrl+Shift+M instead.
[[bind]]
keys = ["Ctrl+Shift+M"]
cmd = "sel.restore"

# FAR's selection matrix: the modifier picks the criterion. These need a terminal that
# reports modified printable keys (kitty, foot, WezTerm, Windows Terminal, xterm with
# modifyOtherKeys); where it does not, the Select menu reaches the same work.
[[bind]]
keys = ["Ctrl++"]
cmd = "sel.ext.add"

[[bind]]
keys = ["Ctrl+-"]
cmd = "sel.ext.remove"

[[bind]]
keys = ["Alt++"]
cmd = "sel.name.add"

[[bind]]
keys = ["Alt+-"]
cmd = "sel.name.remove"

# FAR inverts folders too on Ctrl+*; Alt+* is the one a terminal delivers.
[[bind]]
keys = ["Alt+*"]
cmd = "sel.invert.all"

# ---------------------------------------------------------------- files
[[bind]]
keys = ["Ctrl+A"]
scope = "panel"
cmd = "file.attributes"

# A terminal of its own, which is where `vim` and `top` run. SPEC 06 §4's key, and ConEmu's.
[[bind]]
keys = ["Ctrl+Alt+E"]
cmd = "tool.terminal"

# The item under the cursor, whatever is selected.
[[bind]]
keys = ["Shift+F5"]
cmd = "file.copy.current"

[[bind]]
keys = ["Shift+F6"]
cmd = "file.move.current"

[[bind]]
keys = ["Shift+F8"]
cmd = "file.delete.current"

[[bind]]
keys = ["Ctrl+G"]
cmd = "file.apply"

# Ours, not FAR's: it has no replace across files, and Hiew's is the shape we follow.
[[bind]]
keys = ["Ctrl+Shift+R"]
cmd = "tool.replace"

[[bind]]
keys = ["Alt+F6"]
cmd = "file.link"

[[bind]]
keys = ["Alt+Del"]
cmd = "file.wipe"

# `F8` goes to the system's wastebasket when `general.use_trash` says so; this one never
# does, which is what `Shift+Del` means on every desktop.
[[bind]]
keys = ["Shift+Del"]
scope = "panel"
cmd = "file.delete.permanent"


# ---------------------------------------------------------------- layout
[[bind]]
keys = ["Ctrl+F1"]
cmd = "panel.toggle(left)"

[[bind]]
keys = ["Ctrl+F2"]
cmd = "panel.toggle(right)"

# FAR scrolls long names with Alt+Left/Right; those are history here (docs/03-keymap.md §9).
[[bind]]
keys = ["Ctrl+Shift+Left"]
cmd = "panel.names.left"

[[bind]]
keys = ["Ctrl+Shift+Right"]
cmd = "panel.names.right"

# ---------------------------------------------------------------- misc
[[bind]]
keys = ["Space"]
cmd = "file.dirsize"

[[bind]]
keys = ["Ctrl+O"]
scope = "global"
cmd = "shell.output.show"

[[bind]]
keys = ["Ctrl+Shift+P"]
scope = "global"
cmd = "app.palette"

[[bind]]
keys = ["Alt+T"]
scope = "global"
cmd = "app.theme.next"

# ---------------------------------------------------------------- viewer (F3)
[[bind]]
keys = ["Esc", "F3", "F10", "q"]
scope = "viewer"
cmd = "viewer.quit"

[[bind]]
keys = ["F2"]
scope = "viewer"
cmd = "viewer.wrap"

[[bind]]
keys = ["F4"]
scope = "viewer"
cmd = "viewer.hex"

[[bind]]
keys = ["Shift+F2"]
scope = "viewer"
cmd = "viewer.markdown"

[[bind]]
keys = ["Shift+F4"]
scope = "viewer"
cmd = "viewer.mode.next"

[[bind]]
keys = ["F7", "/"]
scope = "viewer"
cmd = "viewer.search"

[[bind]]
keys = ["Shift+F7", "n"]
scope = "viewer"
cmd = "viewer.search.next"

[[bind]]
keys = ["Alt+F7", "Shift+N"]
scope = "viewer"
cmd = "viewer.search.prev"

[[bind]]
keys = ["F8"]
scope = "viewer"
cmd = "viewer.codepage.next"

[[bind]]
keys = ["Alt+F8", ":"]
scope = "viewer"
cmd = "viewer.goto"

[[bind]]
keys = ["Shift+F"]
scope = "viewer"
cmd = "viewer.follow"

[[bind]]
keys = ["Ctrl+Z"]
scope = "viewer"
cmd = "viewer.undo"

# In hex mode the plain arrows set the row width (the dump has no columns to scroll) and
# `Ctrl+arrow` moves the whole dump by one byte, for a structure that does not begin on a
# multiple of the row width. FAR puts the first pair on `Alt+arrow`; the second pair is its own.
[[bind]]
keys = ["Ctrl+Left"]
scope = "viewer"
cmd = "viewer.shift.back"

[[bind]]
keys = ["Ctrl+Right"]
scope = "viewer"
cmd = "viewer.shift.forward"

[[bind]]
keys = ["["]
scope = "viewer"
cmd = "viewer.bytes.less"

[[bind]]
keys = ["]"]
scope = "viewer"
cmd = "viewer.bytes.more"

[[bind]]
keys = ["Up", "k"]
scope = "viewer"
cmd = "nav.up"

[[bind]]
keys = ["Down", "j"]
scope = "viewer"
cmd = "nav.down"

[[bind]]
keys = ["PgUp", "Ctrl+B", "Ctrl+Up"]
scope = "viewer"
cmd = "nav.pageup"

[[bind]]
keys = ["PgDn", "Space", "Ctrl+Down"]
scope = "viewer"
cmd = "nav.pagedown"

[[bind]]
keys = ["Home", "Ctrl+Home", "g"]
scope = "viewer"
cmd = "nav.top"

[[bind]]
keys = ["End", "Ctrl+End", "Shift+G"]
scope = "viewer"
cmd = "nav.bottom"

[[bind]]
keys = ["Left", "h"]
scope = "viewer"
cmd = "viewer.left"

[[bind]]
keys = ["Right", "l"]
scope = "viewer"
cmd = "viewer.right"

[[bind]]
keys = ["Enter"]
scope = "viewer"
cmd = "viewer.follow.branch"

[[bind]]
keys = ["Backspace"]
scope = "viewer"
cmd = "viewer.back"

[[bind]]
keys = ["F11"]
scope = "viewer"
cmd = "viewer.structure"

[[bind]]
keys = ["Tab"]
scope = "viewer"
cmd = "viewer.pane.next"

[[bind]]
keys = ["F5"]
scope = "viewer"
cmd = "viewer.disasm"

# FAR's F6 in the viewer switches to the editor, so that is what it does here; decompiling
# is ours and moves one key along. See docs/03-keymap.md §7.
[[bind]]
keys = ["F6"]
scope = "viewer"
cmd = "viewer.to.editor"

[[bind]]
keys = ["Shift+F6"]
scope = "viewer"
cmd = "viewer.decompile"

[[bind]]
keys = ["+"]
scope = "viewer"
cmd = "viewer.file.next"

[[bind]]
keys = ["-"]
scope = "viewer"
cmd = "viewer.file.prev"

[[bind]]
keys = ["Ctrl+F10"]
scope = "viewer"
cmd = "viewer.to.panel"

# ---------------------------------------------------------------- editor (F4)
[[bind]]
keys = ["F2"]
scope = "editor"
cmd = "editor.save"

[[bind]]
keys = ["F6"]
scope = "editor"
cmd = "editor.to.viewer"

[[bind]]
keys = ["Shift+F2"]
scope = "editor"
cmd = "editor.save.as"

[[bind]]
keys = ["F4", "F10", "Esc"]
scope = "editor"
cmd = "editor.quit"

[[bind]]
keys = ["F7"]
scope = "editor"
cmd = "editor.search"

[[bind]]
keys = ["Shift+F7"]
scope = "editor"
cmd = "editor.search.next"

[[bind]]
keys = ["Alt+F7"]
scope = "editor"
cmd = "editor.search.prev"

[[bind]]
keys = ["Ctrl+F7"]
scope = "editor"
cmd = "editor.replace"

[[bind]]
keys = ["Alt+F8"]
scope = "editor"
cmd = "editor.goto"

[[bind]]
keys = ["Ctrl+Z"]
scope = "editor"
cmd = "editor.undo"

[[bind]]
keys = ["Ctrl+Shift+Z"]
scope = "editor"
cmd = "editor.redo"

[[bind]]
keys = ["Ctrl+A"]
scope = "editor"
cmd = "editor.select.all"

[[bind]]
keys = ["Ctrl+C", "Ctrl+Ins"]
scope = "editor"
cmd = "editor.copy"

[[bind]]
keys = ["Ctrl+X", "Shift+Del"]
scope = "editor"
cmd = "editor.cut"

[[bind]]
keys = ["Ctrl+V", "Shift+Ins"]
scope = "editor"
cmd = "editor.paste"

# FAR deletes the line with Ctrl+Y, so redo lives on Ctrl+Shift+Z alone.
[[bind]]
keys = ["Ctrl+Y"]
scope = "editor"
cmd = "editor.line.delete"

[[bind]]
keys = ["Ctrl+Shift+D"]
scope = "editor"
cmd = "editor.line.duplicate"

[[bind]]
keys = ["Alt+Up"]
scope = "editor"
cmd = "editor.line.up"

[[bind]]
keys = ["Alt+Down"]
scope = "editor"
cmd = "editor.line.down"

[[bind]]
keys = ["Alt+I"]
scope = "editor"
cmd = "editor.indent"

[[bind]]
keys = ["Alt+U"]
scope = "editor"
cmd = "editor.outdent"

[[bind]]
keys = ["Ctrl+K"]
scope = "editor"
cmd = "editor.delete.to.end"

[[bind]]
keys = ["Ctrl+Backspace"]
scope = "editor"
cmd = "editor.delete.word.left"

[[bind]]
keys = ["Ctrl+Alt+L"]
scope = "editor"
cmd = "editor.readonly.toggle"

[[bind]]
keys = ["Ctrl+R"]
scope = "editor"
cmd = "editor.reload"

# ---------------------------------------------------------------- menus and dialogs (SPEC 10)
[[bind]]
keys = ["Alt+F1"]
scope = "panel"
cmd = "panel.drive(left)"

[[bind]]
keys = ["Alt+F2"]
scope = "panel"
cmd = "panel.drive(right)"

[[bind]]
keys = ["Alt+F12"]
scope = "panel"
cmd = "panel.history"

[[bind]]
keys = ["Alt+F8"]
scope = "panel"
cmd = "cmd.history"

# ------------------------------------------------- command line (SPEC 06 §7)
# Enter, Esc and Backspace are shared with the panel: the command line takes them only when it
# has something on it, which is FAR's rule and the reason it needs no focus of its own.
[[bind]]
keys = ["Ctrl+E"]
scope = "panel"
cmd = "cmd.history.prev"

[[bind]]
keys = ["Ctrl+X"]
scope = "panel"
cmd = "cmd.history.next"

[[bind]]
keys = ["Ctrl+Y"]
scope = "panel"
cmd = "cmd.clear"

# FAR's own second binding for these two: a terminal cannot deliver Ctrl+J (it *is* a
# newline), so Ctrl+Enter and Ctrl+Shift+Enter are the ones we keep. See docs/03-keymap.md §9.
[[bind]]
keys = ["Ctrl+Enter"]
scope = "panel"
cmd = "cmd.insert.name"

[[bind]]
keys = ["Ctrl+Shift+Enter"]
scope = "panel"
cmd = "cmd.insert.name.other"

[[bind]]
keys = ["Ctrl+["]
scope = "panel"
cmd = "cmd.insert.path"

[[bind]]
keys = ["Ctrl+]"]
scope = "panel"
cmd = "cmd.insert.path.other"

# Bytes instead of lines, and back. `F4` already opens a binary this way; this is for the
# times the guess was wrong, either way round.
[[bind]]
keys = ["Alt+H"]
scope = "editor"
cmd = "editor.hex.toggle"

# A block of bytes: the same key Hiew marks one with.
[[bind]]
keys = ["F3"]
scope = "editor"
cmd = "editor.block.mark"

# What to do with the marked bytes. Hiew's own key for it.
[[bind]]
keys = ["F12"]
scope = "hex"
cmd = "editor.block.ops"

# One instruction, assembled where the cursor is. Hiew's own key for it.
[[bind]]
keys = ["F9"]
scope = "editor"
cmd = "editor.assemble"

# The viewers and editors left open. `F12` in the panels and in the viewer; in the hex editor
# that key belongs to the block operations, and `Ctrl+Tab` is there for this.
[[bind]]
keys = ["F12"]
scope = "panel"
cmd = "app.screens"

[[bind]]
keys = ["F12"]
scope = "viewer"
cmd = "app.screens"

[[bind]]
keys = ["F12"]
scope = "editor"
cmd = "app.screens"

[[bind]]
keys = ["Ctrl+Tab"]
scope = "global"
cmd = "app.screen.next"

[[bind]]
keys = ["Ctrl+Shift+Tab"]
scope = "global"
cmd = "app.screen.prev"

# The calculator, on the key that looks like one.
[[bind]]
keys = ["Alt+="]
scope = "global"
cmd = "tool.calculator"

# Macros (SPEC 08 §5). FAR's own keys: record with Ctrl+., then press the key to put it on.
[[bind]]
keys = ["Ctrl+."]
scope = "global"
cmd = "macro.record"

[[bind]]
keys = ["Ctrl+Shift+."]
scope = "global"
cmd = "macro.list"

# The commands the loaded plugins provide. FAR's own key for it.
[[bind]]
keys = ["F11"]
scope = "panel"
cmd = "plugin.commands"
