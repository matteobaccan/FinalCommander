[package]
name = "sc"
description = "SupremeCommander component"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.5.61", features = ["derive"] }
sc-cmd = { version = "0.1.0", path = "../sc-cmd" }
sc-config = { version = "0.1.0", path = "../sc-config" }
sc-core = { version = "0.1.0", path = "../sc-core" }
sc-i18n = { version = "0.1.0", path = "../sc-i18n" }
sc-tui = { version = "0.1.0", path = "../sc-tui" }
sc-ui = { version = "0.1.0", path = "../sc-ui" }
sc-vfs = { version = "0.1.0", path = "../sc-vfs" }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "fs", "sync", "time", "macros"] }

[dev-dependencies]
tempfile = "3.27.0"
