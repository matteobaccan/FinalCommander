id = "commander"
name = "Commander"
author = "SupremeCommander"
variant = "dark"
# The classic orthodox look: blue panels, cyan text, yellow marks, cyan key bar.

[palette]
blue = "#000080"
cyan = "#00aaaa"
lightcyan = "#55ffff"
white = "#c0c0c0"
bright = "#ffffff"
yellow = "#ffff55"
red = "#ff5555"
grey = "#808080"
green = "#55ff55"
magenta = "#ff55ff"

[colors]
"panel.bg" = "blue"
"panel.fg" = "lightcyan"
"panel.frame" = "cyan"
"panel.header.fg" = "bright"
"panel.header.bg" = "blue"
"panel.header.inactive.fg" = "cyan"
"panel.footer.fg" = "cyan"
"cursor.fg" = "blue"
"cursor.bg" = "lightcyan"
"cursor.inactive.fg" = "lightcyan"
"cursor.inactive.bg" = "#000060"
"selected.fg" = "yellow"
"file.dir" = "bright"
"file.exec" = "green"
"file.symlink" = "magenta"
"file.archive" = "magenta"
"file.hidden" = "grey"
"file.broken" = "red"
"keybar.fg" = "#000000"
"keybar.bg" = "cyan"
"keybar.num.fg" = "white"
"keybar.num.bg" = "#000000"
"status.fg" = "bright"
"status.bg" = "blue"
"cmdline.fg" = "white"
"cmdline.bg" = "#000000"
"dialog.fg" = "#000000"
"dialog.bg" = "white"
"dialog.frame" = "#000000"
"dialog.title" = "#000080"
"error.fg" = "red"
"filter.fg" = "yellow"
"search.fg" = "yellow"
