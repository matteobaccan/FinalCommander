id = "tron"
name = "Tron"
author = "SupremeCommander"
variant = "dark"
# Neon grid: cyan on near-black with orange accents.

[palette]
bg = "#04080f"
fg = "#7fdbff"
dim = "#1b6ca8"
neon = "#00e5ff"
white = "#e8f7ff"
orange = "#ff9f1c"
red = "#ff5370"
grey = "#3a5a72"

[colors]
"panel.bg" = "bg"
"panel.fg" = "fg"
"panel.frame" = "dim"
"panel.header.fg" = "neon"
"panel.header.bg" = "#06121f"
"panel.header.inactive.fg" = "grey"
"panel.footer.fg" = "grey"
"cursor.fg" = "bg"
"cursor.bg" = "neon"
"cursor.inactive.fg" = "neon"
"cursor.inactive.bg" = "#0a2233"
"selected.fg" = "orange"
"file.dir" = "white"
"file.exec" = "#00ffc6"
"file.symlink" = "#a9e8ff"
"file.archive" = "orange"
"file.hidden" = "grey"
"file.broken" = "red"
"keybar.fg" = "bg"
"keybar.bg" = "neon"
"keybar.num.fg" = "fg"
"keybar.num.bg" = "bg"
"status.fg" = "white"
"status.bg" = "#06121f"
"cmdline.fg" = "fg"
"cmdline.bg" = "bg"
"dialog.fg" = "white"
"dialog.bg" = "#082133"
"dialog.frame" = "neon"
"dialog.title" = "orange"
"error.fg" = "red"
"filter.fg" = "orange"
"search.fg" = "orange"
