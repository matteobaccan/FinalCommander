id = "black"
name = "Black"
author = "SupremeCommander"
variant = "dark"
# Near-monochrome: black background, grey text, white cursor. Low-contrast terminals, e-ink.

[palette]
bg = "#000000"
fg = "#b4b4b4"
dim = "#6a6a6a"
bright = "#ffffff"
accent = "#e0e0e0"

[colors]
"panel.bg" = "bg"
"panel.fg" = "fg"
"panel.frame" = "dim"
"panel.header.fg" = "bright"
"panel.header.bg" = "bg"
"panel.header.inactive.fg" = "dim"
"panel.footer.fg" = "dim"
"cursor.fg" = "bg"
"cursor.bg" = "accent"
"cursor.inactive.fg" = "bright"
"cursor.inactive.bg" = "#2a2a2a"
"selected.fg" = "bright"
"file.dir" = "bright"
"file.exec" = "accent"
"file.symlink" = "fg"
"file.archive" = "fg"
"file.temp" = "dim"
"file.hidden" = "dim"
"file.broken" = "#ff6b6b"
"keybar.fg" = "bg"
"keybar.bg" = "#9a9a9a"
"keybar.num.fg" = "fg"
"keybar.num.bg" = "bg"
"keybar.background.fg" = "fg"
"keybar.background.bg" = "bg"
"panel.info.selected.fg" = "#e8e8e8"
"panel.info.selected.bg" = "#3a3a3a"
"status.fg" = "bright"
"status.bg" = "#141414"
"cmdline.fg" = "fg"
"cmdline.bg" = "bg"
"dialog.fg" = "bg"
"dialog.bg" = "#c8c8c8"
"dialog.frame" = "bg"
"dialog.title" = "bg"
"error.fg" = "#ff6b6b"
"filter.fg" = "bright"
"search.fg" = "bright"
"panel.title.active.fg" = "bg"
"panel.title.active.bg" = "accent"
"panel.column.fg" = "bright"
"panel.scrollbar.fg" = "dim"
"hmenu.fg" = "bg"
"hmenu.bg" = "#9a9a9a"
"hmenu.selected.fg" = "bright"
"hmenu.selected.bg" = "bg"
"menu.fg" = "bg"
"menu.bg" = "#c8c8c8"
"menu.frame" = "bg"
"menu.title.fg" = "bg"
"menu.selected.fg" = "bright"
"menu.selected.bg" = "bg"
"menu.hotkey.fg" = "bg"
"menu.dim.fg" = "dim"
"dialog.edit.fg" = "bright"
"dialog.edit.bg" = "#3c3c3c"
"dialog.button.fg" = "bg"
"dialog.button.bg" = "#c8c8c8"
"dialog.button.selected.fg" = "bright"
"dialog.button.selected.bg" = "bg"
"warn.fg" = "bright"
"warn.bg" = "#3c3c3c"
"warn.frame" = "bright"
