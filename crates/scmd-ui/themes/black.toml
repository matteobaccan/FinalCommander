id = "black"
name = "Black"
author = "SupremeCommander"
variant = "dark"
# Near-monochrome: black background, grey text, white cursor. Low-contrast terminals, e-ink.

[palette]
bg = "#000000"
fg = "#b4b4b4"
dim = "#6a6a6a"
bright = "#ffffff"
accent = "#e0e0e0"

[colors]
"panel.bg" = "bg"
"panel.fg" = "fg"
"panel.frame" = "dim"
"panel.header.fg" = "bright"
"panel.header.bg" = "bg"
"panel.header.inactive.fg" = "dim"
"panel.footer.fg" = "dim"
"cursor.fg" = "bg"
"cursor.bg" = "accent"
"cursor.inactive.fg" = "bright"
"cursor.inactive.bg" = "#2a2a2a"
"selected.fg" = "bright"
"file.dir" = "bright"
"file.exec" = "accent"
"file.symlink" = "fg"
"file.archive" = "fg"
"file.temp" = "dim"
"file.hidden" = "dim"
"file.broken" = "#ff6b6b"
"keybar.fg" = "bg"
"keybar.bg" = "#9a9a9a"
"keybar.num.fg" = "fg"
"keybar.num.bg" = "bg"
"keybar.background.fg" = "fg"
"keybar.background.bg" = "bg"
"panel.info.selected.fg" = "#e8e8e8"
"panel.info.selected.bg" = "#3a3a3a"
"status.fg" = "bright"
"status.bg" = "#141414"
"cmdline.fg" = "fg"
"cmdline.bg" = "bg"
"dialog.fg" = "bg"
"dialog.bg" = "#c8c8c8"
"dialog.frame" = "bg"
"dialog.title" = "bg"
"error.fg" = "#ff6b6b"
"filter.fg" = "bright"
"search.fg" = "bright"
"panel.title.active.fg" = "bg"
"panel.title.active.bg" = "accent"
"panel.tab.fg" = "fg"
"panel.tab.bg" = "bg"
"panel.tab.active.fg" = "bg"
"panel.tab.active.bg" = "accent"
"panel.column.fg" = "bright"
"panel.scrollbar.fg" = "dim"
"hmenu.fg" = "bg"
"hmenu.bg" = "#9a9a9a"
"hmenu.selected.fg" = "bright"
"hmenu.selected.bg" = "bg"
"menu.fg" = "bg"
"menu.bg" = "#c8c8c8"
"menu.frame" = "bg"
"menu.title.fg" = "bg"
"menu.selected.fg" = "bright"
"menu.selected.bg" = "bg"
"menu.hotkey.fg" = "bg"
"menu.dim.fg" = "dim"
"dialog.edit.fg" = "bright"
"dialog.edit.bg" = "#3c3c3c"
"dialog.button.fg" = "bg"
"dialog.button.bg" = "#c8c8c8"
"dialog.button.selected.fg" = "bright"
"dialog.button.selected.bg" = "bg"
"warn.fg" = "bright"
"warn.bg" = "#3c3c3c"
"warn.frame" = "bright"

# Viewer.Text / Viewer.Status / Viewer.Text.Selected, and the same three for the editor.
# In FAR's palette.cpp the two views carry the panel's own text colours and a status line that
# is the key bar's — Viewer.Status, Editor.Status and Keybar are one value there — so a theme
# answers these from what it already says about those two.
"viewer.fg" = "fg"
"viewer.bg" = "bg"
"viewer.status.fg" = "bg"
"viewer.status.bg" = "#9a9a9a"
"viewer.selected.fg" = "bg"
"viewer.selected.bg" = "#9a9a9a"
"editor.fg" = "fg"
"editor.bg" = "bg"
"editor.status.fg" = "bg"
"editor.status.bg" = "#9a9a9a"
"editor.selected.fg" = "bg"
"editor.selected.bg" = "#9a9a9a"

# Syntax, for the editor and the viewer: foregrounds only, on the editor's own
# background, so a coloured run never changes the colour of the page behind it.
"syntax.keyword" = "bright"
"syntax.type" = "accent"
"syntax.string" = "#9cd49c"
"syntax.number" = "#d6a0d6"
"syntax.comment" = "dim"
"syntax.preproc" = "#d6c48c"
"syntax.tag" = "accent"
"syntax.attr" = "#d6c48c"
"syntax.entity" = "#d6a0d6"
"syntax.function" = "bright"
"syntax.text" = "fg"
