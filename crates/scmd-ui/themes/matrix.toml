id = "matrix"
name = "Matrix"
author = "SupremeCommander"
variant = "dark"
# Green phosphor on black.

[palette]
bg = "#000000"
fg = "#00cc33"
dim = "#006618"
bright = "#66ff88"
neon = "#00ff41"
pale = "#aaffaa"
red = "#ff4444"

[colors]
"panel.bg" = "bg"
"panel.fg" = "fg"
"panel.frame" = "dim"
"panel.header.fg" = "neon"
"panel.header.bg" = "#001a06"
"panel.header.inactive.fg" = "dim"
"panel.footer.fg" = "dim"
"cursor.fg" = "bg"
"cursor.bg" = "neon"
"cursor.inactive.fg" = "neon"
"cursor.inactive.bg" = "#002b0c"
"selected.fg" = "pale"
"file.dir" = "bright"
"file.exec" = "neon"
"file.symlink" = "#00ffaa"
"file.archive" = "#00d9a3"
"file.temp" = "dim"
"file.hidden" = "dim"
"file.broken" = "red"
"keybar.fg" = "bg"
"keybar.bg" = "fg"
"keybar.num.fg" = "neon"
"keybar.num.bg" = "bg"
"keybar.background.fg" = "neon"
"keybar.background.bg" = "bg"
"panel.info.selected.fg" = "bg"
"panel.info.selected.bg" = "neon"
"status.fg" = "neon"
"status.bg" = "#001a06"
"cmdline.fg" = "fg"
"cmdline.bg" = "bg"
"dialog.fg" = "neon"
"dialog.bg" = "#001206"
"dialog.frame" = "fg"
"dialog.title" = "pale"
"error.fg" = "red"
"filter.fg" = "pale"
"search.fg" = "pale"
"panel.title.active.fg" = "bg"
"panel.title.active.bg" = "neon"
"panel.column.fg" = "pale"
"panel.scrollbar.fg" = "dim"
"hmenu.fg" = "bg"
"hmenu.bg" = "fg"
"hmenu.selected.fg" = "neon"
"hmenu.selected.bg" = "bg"
"menu.fg" = "neon"
"menu.bg" = "#001206"
"menu.frame" = "fg"
"menu.title.fg" = "pale"
"menu.selected.fg" = "bg"
"menu.selected.bg" = "neon"
"menu.hotkey.fg" = "pale"
"menu.dim.fg" = "dim"
"dialog.edit.fg" = "neon"
"dialog.edit.bg" = "#001a06"
"dialog.button.fg" = "neon"
"dialog.button.bg" = "#001a06"
"dialog.button.selected.fg" = "bg"
"dialog.button.selected.bg" = "neon"
"warn.fg" = "pale"
"warn.bg" = "#2a0000"
"warn.frame" = "red"

# Viewer.Text / Viewer.Status / Viewer.Text.Selected, and the same three for the editor.
# In FAR's palette.cpp the two views carry the panel's own text colours and a status line that
# is the key bar's — Viewer.Status, Editor.Status and Keybar are one value there — so a theme
# answers these from what it already says about those two.
"viewer.fg" = "fg"
"viewer.bg" = "bg"
"viewer.status.fg" = "bg"
"viewer.status.bg" = "fg"
"viewer.selected.fg" = "bg"
"viewer.selected.bg" = "fg"
"editor.fg" = "fg"
"editor.bg" = "bg"
"editor.status.fg" = "bg"
"editor.status.bg" = "fg"
"editor.selected.fg" = "bg"
"editor.selected.bg" = "fg"

# Syntax, for the editor and the viewer: foregrounds only, on the editor's own
# background, so a coloured run never changes the colour of the page behind it.
"syntax.keyword" = "bright"
"syntax.type" = "neon"
"syntax.string" = "pale"
"syntax.number" = "bright"
"syntax.comment" = "dim"
"syntax.preproc" = "neon"
"syntax.tag" = "neon"
"syntax.attr" = "pale"
"syntax.entity" = "bright"
"syntax.function" = "pale"
"syntax.text" = "fg"
