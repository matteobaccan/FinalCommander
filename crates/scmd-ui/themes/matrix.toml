id = "matrix"
name = "Matrix"
author = "SupremeCommander"
variant = "dark"
# Green phosphor on black.

[palette]
bg = "#000000"
fg = "#00cc33"
dim = "#006618"
bright = "#66ff88"
neon = "#00ff41"
pale = "#aaffaa"
red = "#ff4444"

[colors]
"panel.bg" = "bg"
"panel.fg" = "fg"
"panel.frame" = "dim"
"panel.header.fg" = "neon"
"panel.header.bg" = "#001a06"
"panel.header.inactive.fg" = "dim"
"panel.footer.fg" = "dim"
"cursor.fg" = "bg"
"cursor.bg" = "neon"
"cursor.inactive.fg" = "neon"
"cursor.inactive.bg" = "#002b0c"
"selected.fg" = "pale"
"file.dir" = "bright"
"file.exec" = "neon"
"file.symlink" = "#00ffaa"
"file.archive" = "#00d9a3"
"file.hidden" = "dim"
"file.broken" = "red"
"keybar.fg" = "bg"
"keybar.bg" = "fg"
"keybar.num.fg" = "neon"
"keybar.num.bg" = "bg"
"status.fg" = "neon"
"status.bg" = "#001a06"
"cmdline.fg" = "fg"
"cmdline.bg" = "bg"
"dialog.fg" = "neon"
"dialog.bg" = "#001206"
"dialog.frame" = "fg"
"dialog.title" = "pale"
"error.fg" = "red"
"filter.fg" = "pale"
"search.fg" = "pale"
