[package]
name = "scmd"
description = "SupremeCommander: a cross-platform orthodox file manager for the terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
thiserror = "2"
toml = "1.0.7"
anyhow = "1.0.104"
clap = { version = "4.5.61", features = ["derive"] }
scmd-arc = { workspace = true }
scmd-cmd = { workspace = true }
scmd-config = { workspace = true }
scmd-core = { workspace = true }
scmd-edit = { workspace = true }
scmd-find = { workspace = true }
scmd-i18n = { workspace = true }
scmd-jobs = { workspace = true }
scmd-net = { workspace = true }
scmd-plug = { workspace = true }
scmd-s3 = { workspace = true }
scmd-tui = { workspace = true }
scmd-ui = { workspace = true }
scmd-vfs = { workspace = true }
scmd-view = { workspace = true }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "fs", "sync", "time", "macros"] }
unicode-width = "0.2.2"
clap_mangen = "0.3"

# Free space in the panel frame needs `statvfs`, which `std` does not expose. Unix only:
# Windows wants `GetDiskFreeSpaceEx` and gets its own answer when it gets its own crate.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["fs"] }

[dev-dependencies]
tempfile = "3.27.0"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
