[package]
name = "scmd"
description = "SupremeCommander: a cross-platform orthodox file manager for the terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
thiserror = "2"
toml = "1.0.7"
anyhow = "1.0.104"
clap = { version = "4.5.61", features = ["derive"] }
scmd-cmd = { version = "0.0.2", path = "../scmd-cmd" }
scmd-config = { version = "0.0.2", path = "../scmd-config" }
scmd-core = { version = "0.0.2", path = "../scmd-core" }
scmd-edit = { version = "0.0.2", path = "../scmd-edit" }
scmd-i18n = { version = "0.0.2", path = "../scmd-i18n" }
scmd-jobs = { version = "0.0.2", path = "../scmd-jobs" }
scmd-net = { version = "0.0.2", path = "../scmd-net" }
scmd-plug = { version = "0.0.2", path = "../scmd-plug" }
scmd-tui = { version = "0.0.2", path = "../scmd-tui" }
scmd-ui = { version = "0.0.2", path = "../scmd-ui" }
scmd-vfs = { version = "0.0.2", path = "../scmd-vfs" }
scmd-view = { version = "0.0.2", path = "../scmd-view" }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "fs", "sync", "time", "macros"] }
unicode-width = "0.2.2"

# Free space in the panel frame needs `statvfs`, which `std` does not expose. Unix only:
# Windows wants `GetDiskFreeSpaceEx` and gets its own answer when it gets its own crate.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["fs"] }

[dev-dependencies]
tempfile = "3.27.0"
