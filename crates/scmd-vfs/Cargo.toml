[package]
name = "scmd-vfs"
description = "SupremeCommander component"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
async-trait = "0.1.92"
scmd-arc = { workspace = true }
scmd-core = { workspace = true }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "fs", "sync", "time", "macros"] }

[dev-dependencies]
tempfile = "3.27.0"
# Only to build the archive a test then reads.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
