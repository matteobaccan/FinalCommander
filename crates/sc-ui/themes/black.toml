id = "black"
name = "Black"
author = "SupremeCommander"
variant = "dark"
# Near-monochrome: black background, grey text, white cursor. Low-contrast terminals, e-ink.

[palette]
bg = "#000000"
fg = "#b4b4b4"
dim = "#6a6a6a"
bright = "#ffffff"
accent = "#e0e0e0"

[colors]
"panel.bg" = "bg"
"panel.fg" = "fg"
"panel.frame" = "dim"
"panel.header.fg" = "bright"
"panel.header.bg" = "bg"
"panel.header.inactive.fg" = "dim"
"panel.footer.fg" = "dim"
"cursor.fg" = "bg"
"cursor.bg" = "accent"
"cursor.inactive.fg" = "bright"
"cursor.inactive.bg" = "#2a2a2a"
"selected.fg" = "bright"
"file.dir" = "bright"
"file.exec" = "accent"
"file.symlink" = "fg"
"file.archive" = "fg"
"file.hidden" = "dim"
"file.broken" = "#ff6b6b"
"keybar.fg" = "bg"
"keybar.bg" = "#9a9a9a"
"keybar.num.fg" = "fg"
"keybar.num.bg" = "bg"
"status.fg" = "bright"
"status.bg" = "#141414"
"cmdline.fg" = "fg"
"cmdline.bg" = "bg"
"dialog.fg" = "bg"
"dialog.bg" = "#c8c8c8"
"dialog.frame" = "bg"
"dialog.title" = "bg"
"error.fg" = "#ff6b6b"
"filter.fg" = "bright"
"search.fg" = "bright"
