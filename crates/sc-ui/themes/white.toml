id = "white"
name = "White"
author = "SupremeCommander"
variant = "light"
# Light theme for daylight, projectors and printed screenshots.

[palette]
bg = "#ffffff"
fg = "#1c1c1c"
dim = "#6c6c6c"
blue = "#0a3d91"
accent = "#1c3f94"
orange = "#a63d00"
red = "#b00020"
green = "#006644"
purple = "#6a1b9a"
rule = "#9aa0a6"

[colors]
"panel.bg" = "bg"
"panel.fg" = "fg"
"panel.frame" = "rule"
"panel.header.fg" = "blue"
"panel.header.bg" = "#eef1f5"
"panel.header.inactive.fg" = "dim"
"panel.footer.fg" = "dim"
"cursor.fg" = "bg"
"cursor.bg" = "accent"
"cursor.inactive.fg" = "fg"
"cursor.inactive.bg" = "#dfe4ea"
"selected.fg" = "orange"
"file.dir" = "blue"
"file.exec" = "green"
"file.symlink" = "purple"
"file.archive" = "purple"
"file.hidden" = "dim"
"file.broken" = "red"
"keybar.fg" = "bg"
"keybar.bg" = "accent"
"keybar.num.fg" = "fg"
"keybar.num.bg" = "#dfe4ea"
"status.fg" = "fg"
"status.bg" = "#eef1f5"
"cmdline.fg" = "fg"
"cmdline.bg" = "#f6f7f9"
"dialog.fg" = "fg"
"dialog.bg" = "#eef1f5"
"dialog.frame" = "rule"
"dialog.title" = "blue"
"error.fg" = "red"
"filter.fg" = "orange"
"search.fg" = "orange"
