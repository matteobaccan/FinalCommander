[package]
name = "fcmd-edit"
description = "FinalCommander: the internal editor (buffer, undo, blocks, search, atomic save)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
fcmd-core = { workspace = true }
# A raw device on Windows, where the name is not a directory entry and the length and the
# sector have to be asked of the device itself (SPEC 05 §1.10).
fcmd-platform = { workspace = true }
fcmd-syntax = { workspace = true }
fcmd-view = { workspace = true }
regex = "1"
thiserror = "2"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"
