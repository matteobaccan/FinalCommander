[package]
name = "fcmd-net"
description = "FinalCommander: netbox — network filesystems (SFTP today) and the site list"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
fcmd-config = { workspace = true }
fcmd-arc = { workspace = true }
fcmd-core = { workspace = true }
fcmd-vfs = { workspace = true }
fcmd-jobs = { workspace = true }
async-trait = "0.1"
russh = { version = "0.64.1", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3.0.1"
# FTP and FTPS. `tokio` for the runtime this crate already runs on, and `tokio-rustls-ring` for
# the TLS, which is the same rustls and the same `ring` the rest of the tree uses rather than a
# second implementation beside them.
suppaftp = { version = "12.2.1", default-features = false, features = [
  "tokio",
  "tokio-rustls-ring",
] }
# The machine's own certificate authorities, for FTPS and WebDAV. Already in the tree under
# `reqwest`, for the same reason: a server inside a company is behind that company's CA.
rustls-native-certs = "0.8"
# WebDAV is six HTTP methods and one XML document, so the client is hand-written over
# `reqwest` as the object store's is — same crate, same features, same reasoning about the
# trust anchors (see `crates/fcmd-s3/Cargo.toml`, which says it at length).
reqwest = { version = "0.13", default-features = false, features = [
  "rustls-tls-native-roots",
  "http2",
  "stream",
  "socks",
] }
# `StreamReader` and `ReaderStream`: a WebDAV body is read and written as it travels rather
# than held in memory. Already in the tree under `reqwest`.
tokio-util = { version = "0.7", default-features = false, features = ["io"] }
futures-util = { version = "0.3", default-features = false }
thiserror = "2"
tokio = { version = "1", features = ["rt", "io-util", "net", "time", "macros", "fs"] }

[dev-dependencies]
# The live test runs an SSH + SFTP server in process, which needs a throwaway host key.
rand = "0.10.3"
russh-sftp = "3.0.1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
