[package]
name = "fcmd-platform"
description = "FinalCommander: the calls the standard library does not make (free space, cluster size, memory)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]

# `statvfs` for the free space and the cluster size, and `getpwuid`/`getgrgid` behind safe
# wrappers for the owner of a file. Already in the tree for the terminal.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["fs", "user"] }

# How much memory the machine has, which on macOS is a `sysctl` and nothing else.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

# The three calls Windows needs for the same answers: `GetDiskFreeSpaceExW` for the bytes,
# `GetDiskFreeSpaceW` for the cluster, `GlobalMemoryStatusEx` for the memory. Microsoft's own
# bindings, MIT, and already in the tree under `rustix` and `mio`.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_SystemInformation",
  # The owner of a file, which Windows keeps as a SID in the security descriptor:
  # `GetNamedSecurityInfoW` to read it, `LookupAccountSidW` to put a name to it.
  "Win32_Security",
  "Win32_Security_Authorization",
  # What is running: the process snapshot, and the memory of one process.
  "Win32_System_Diagnostics_ToolHelp",
  # What is listening: the TCP and UDP tables, with the pid that owns each row.
  "Win32_NetworkManagement_IpHelper",
  # What is installed: the key the Control Panel's own list of programs reads.
  "Win32_System_Registry",
  # What a drive letter *is*: `WNetGetConnectionW` for the share behind a mapped one.
  "Win32_NetworkManagement_WNet",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  # Which login session a process belongs to, which Windows counts as a Terminal Services
  # question even on a machine nobody logs into twice.
  "Win32_System_RemoteDesktop",
] }
