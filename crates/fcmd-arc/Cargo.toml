[package]
name = "fcmd-arc"
description = "FinalCommander: the archive provider (what is inside a zip or a tar, and how to get it out)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# Every decoder here is pure Rust: the binary stays one file that cross-compiles without a C
# toolchain, which is the whole point of the release matrix.
bzip2 = "0.6"
flate2 = "1"
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "xz", "encoder"] }
ruzstd = "0.9"
# 7z, reading and writing. The feature list is the codecs 7-Zip itself writes by default plus
# the two optional ones a real-world archive turns out to use: `deflate` for an archive made
# from a zip, `aes256` so an encrypted one is recognised and refused with a reason rather than
# read as rubble. `util` (whole-archive convenience functions) and the codecs only 7-Zip ZS
# writes (zstd, lz4, brotli) are left out.
sevenz-rust2 = { version = "0.25.0", default-features = false, features = [
  "compress",
  "bzip2",
  "ppmd",
  "deflate",
  "aes256",
] }
fcmd-core = { workspace = true }
# The listing grammar of `ext`: an external archiver prints a table and the table in the
# configuration says how to read it, as a pattern with named captures — which is MultiArc's
# own newer grammar and the only one worth copying (docs/05-multiarc.md §5). Already in the
# tree under four other crates, so nothing new ships because of this.
regex = "1"
# SQLite databases as a container (`sqlite.rs`): tables as CSV entries, and the queries of
# `sql:`. The one C library in this crate, on purpose: SQLite's file format can be read by
# hand, but a query needs SQLite itself, and `bundled` compiles the amalgamation into the
# binary, so it is still one file with nothing to install. The release matrix compiles C
# already (`ring` under the SSH client, with `musl-gcc` for the static build). SQLite is in
# the public domain; rusqlite and libsqlite3-sys are MIT.
# JSON documents as a container (`json.rs`). Already a direct dependency of fcmd-view and
# fcmd-plug, with `preserve_order` there, so a document's keys keep their order here too.
serde_json = "1.0.154"
# The charsets mail is written in (`mail.rs`). Already a direct dependency of fcmd-view.
encoding_rs = "0.8"
rusqlite = { version = "0.41", features = ["bundled"] }
thiserror = "2"
zip = { version = "9", default-features = false, features = [
  "deflate-flate2",
  "deflate64",
  "bzip2",
  "lzma",
  "xz",
] }

[dev-dependencies]
tempfile = "3"
