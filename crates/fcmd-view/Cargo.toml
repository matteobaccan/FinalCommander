[package]
name = "fcmd-view"
description = "FinalCommander: the internal viewer (text, dump, hex) for files of any size"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
fcmd-core = { workspace = true }
# A raw device on Windows: how long it is and the sector it insists on being read in, which
# are the two calls `std` does not make (SPEC 05 §1.10).
fcmd-platform = { workspace = true }
fcmd-syntax = { workspace = true }
encoding_rs = "0.8"
memchr = "2"
regex = "1"
thiserror = "2"
unicode-width = "0.2"
# One JSON object per line is a format we read in table mode (SPEC 05 §1.11); the parser is
# already in the tree for the plugin protocol, so this is one dependency rather than two.
# `preserve_order` is what makes the columns come out in the order the keys are written in the
# file rather than alphabetically, which is the difference between a readable log and a
# shuffled one. It uses `indexmap`, which is already in the tree under several other crates.
serde_json = { version = "1.0.154", features = ["preserve_order"] }
object = { version = "0.40.0", default-features = false, features = ["read_core", "elf", "pe", "macho", "archive", "std"] }
iced-x86 = { version = "1.21.0", default-features = false, features = ["decoder", "intel", "std"] }
wasmprinter = "0.262.0"
# AArch64 decoding (SPEC 05 §1.6). A viewer that only reads x86 is half a tool on an Apple
# Silicon laptop or an ARM server, and an instruction table is not something to write twice.
# 0BSD, pure Rust — so the Windows and macOS builds need no C toolchain, unlike the usual
# alternatives, which wrap a C disassembler. `fmt` is the one feature we want: the decoder's
# own spelling of an instruction, which this crate then re-reads for the branch targets.
yaxpeax-arm = { version = "0.5.0", default-features = false, features = ["std", "alloc", "fmt"] }
yaxpeax-arch = { version = "0.3.3", default-features = false }
# Pictures in the viewer (SPEC 05 §1.14): the decoder only, never the drawing, which is ours.
# `default-features = false` is what keeps this small — the four formats a commander actually
# opens and none of the research ones, no `rayon`, no C. One dependency instead of four
# separate decoders, and the same crates underneath either way.
image = { version = "0.25.10", default-features = false, features = [
  "png",
  "jpeg",
  "gif",
  "bmp",
] }

[dev-dependencies]
tempfile = "3"
