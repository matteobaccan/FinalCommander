[package]
name = "scmd-core"
description = "SupremeCommander: core domain types (paths, entries, listings, sorting, selection)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
globset = "0.4"
regex = "1"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"
