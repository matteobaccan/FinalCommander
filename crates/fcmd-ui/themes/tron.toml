id = "tron"
name = "Tron"
author = "FinalCommander"
variant = "dark"
# Neon grid: cyan on near-black with orange accents.

[palette]
bg = "#04080f"
fg = "#7fdbff"
dim = "#1b6ca8"
neon = "#00e5ff"
white = "#e8f7ff"
orange = "#ff9f1c"
red = "#ff5370"
grey = "#3a5a72"

[colors]
"panel.bg" = "bg"
"panel.fg" = "fg"
"panel.frame" = "dim"
"panel.header.fg" = "neon"
"panel.header.bg" = "#06121f"
"panel.header.inactive.fg" = "grey"
"panel.footer.fg" = "grey"
"cursor.fg" = "bg"
"cursor.bg" = "neon"
"cursor.inactive.fg" = "neon"
"cursor.inactive.bg" = "#0a2233"
"selected.fg" = "orange"
"file.dir" = "white"
"file.exec" = "#00ffc6"
"file.symlink" = "#a9e8ff"
"file.archive" = "orange"
"file.temp" = "grey"
"file.hidden" = "grey"
"file.broken" = "red"
"keybar.fg" = "bg"
"keybar.bg" = "neon"
"keybar.num.fg" = "fg"
"keybar.num.bg" = "bg"
"keybar.background.fg" = "fg"
"keybar.background.bg" = "bg"
"panel.info.selected.fg" = "bg"
"panel.info.selected.bg" = "fg"
"status.fg" = "white"
"status.bg" = "#06121f"
"cmdline.fg" = "fg"
"cmdline.bg" = "bg"
"cmdline.hint.fg" = "grey"
"dialog.fg" = "white"
"dialog.bg" = "#082133"
"dialog.frame" = "neon"
"dialog.title" = "orange"
"error.fg" = "red"
"filter.fg" = "orange"
"search.fg" = "orange"
"panel.title.active.fg" = "bg"
"panel.title.active.bg" = "neon"
"panel.tab.fg" = "fg"
"panel.tab.bg" = "bg"
"panel.tab.active.fg" = "bg"
"panel.tab.active.bg" = "neon"
"panel.column.fg" = "orange"
"panel.scrollbar.fg" = "dim"
"hmenu.fg" = "bg"
"hmenu.bg" = "neon"
"hmenu.selected.fg" = "white"
"hmenu.selected.bg" = "bg"
"hmenu.hotkey.fg" = "orange"
"menu.fg" = "white"
"menu.bg" = "#082133"
"menu.frame" = "neon"
"menu.title.fg" = "orange"
"menu.selected.fg" = "bg"
"menu.selected.bg" = "neon"
"menu.hotkey.fg" = "orange"
"menu.dim.fg" = "grey"
"dialog.edit.fg" = "white"
"dialog.edit.bg" = "#06121f"
"dialog.button.fg" = "white"
"dialog.button.bg" = "#0c2c42"
"dialog.button.selected.fg" = "bg"
"dialog.button.selected.bg" = "neon"
"help.heading.fg" = "orange"
"help.code.fg" = "neon"
"help.marker.fg" = "neon"
"help.link.fg" = "orange"
"help.frame.fg" = "grey"
"warn.fg" = "white"
"warn.bg" = "#3a0a16"
"warn.frame" = "red"

# Viewer.Text / Viewer.Status / Viewer.Text.Selected, and the same three for the editor.
# In FAR's palette.cpp the two views carry the panel's own text colours and a status line that
# is the key bar's — Viewer.Status, Editor.Status and Keybar are one value there — so a theme
# answers these from what it already says about those two.
"viewer.fg" = "fg"
"viewer.bg" = "bg"
"viewer.status.fg" = "bg"
"viewer.status.bg" = "neon"
"viewer.selected.fg" = "bg"
"viewer.selected.bg" = "neon"
"editor.fg" = "fg"
"editor.bg" = "bg"
"editor.status.fg" = "bg"
"editor.status.bg" = "neon"
"editor.selected.fg" = "bg"
"editor.selected.bg" = "neon"

# Syntax, for the editor and the viewer: foregrounds only, on the editor's own
# background, so a coloured run never changes the colour of the page behind it.
"syntax.keyword" = "white"
"syntax.type" = "neon"
"syntax.string" = "#7fffd4"
"syntax.number" = "orange"
"syntax.comment" = "grey"
"syntax.preproc" = "orange"
"syntax.tag" = "neon"
"syntax.attr" = "orange"
"syntax.entity" = "red"
"syntax.function" = "white"
"syntax.text" = "fg"
