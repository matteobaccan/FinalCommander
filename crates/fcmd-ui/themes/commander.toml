id = "commander"
name = "Commander"
author = "FinalCommander"
variant = "dark"
# The classic orthodox look: blue panels, cyan text, yellow marks, cyan key bar.

[palette]
blue = "#000080"
cyan = "#00aaaa"
lightcyan = "#55ffff"
white = "#c0c0c0"
bright = "#ffffff"
yellow = "#ffff55"
red = "#ff5555"
grey = "#808080"
green = "#55ff55"
magenta = "#ff55ff"

[colors]
"panel.bg" = "blue"
"panel.fg" = "lightcyan"
"panel.frame" = "cyan"
"panel.header.fg" = "bright"
"panel.header.bg" = "blue"
"panel.header.inactive.fg" = "cyan"
"panel.footer.fg" = "cyan"
"cursor.fg" = "blue"
"cursor.bg" = "lightcyan"
"cursor.inactive.fg" = "lightcyan"
"cursor.inactive.bg" = "#000060"
"selected.fg" = "yellow"
"file.dir" = "bright"
"file.exec" = "green"
"file.symlink" = "magenta"
"file.archive" = "magenta"
"file.temp" = "#aa8800"
"file.hidden" = "grey"
"file.broken" = "red"
"keybar.fg" = "#000000"
"keybar.bg" = "cyan"
"keybar.num.fg" = "white"
"keybar.num.bg" = "#000000"
"keybar.background.fg" = "white"
"keybar.background.bg" = "#000000"
"panel.info.selected.fg" = "yellow"
"panel.info.selected.bg" = "cyan"
"status.fg" = "bright"
"status.bg" = "blue"
"cmdline.fg" = "white"
"cmdline.bg" = "#000000"
"cmdline.hint.fg" = "grey"
"dialog.fg" = "#000000"
"dialog.bg" = "white"
"dialog.frame" = "#000000"
"dialog.title" = "#000080"
"error.fg" = "red"
"filter.fg" = "yellow"
"search.fg" = "yellow"
# the menu bar and the pulled-down menus (FAR: cyan with yellow hotkeys)
"panel.title.active.fg" = "#000000"
"panel.title.active.bg" = "cyan"
"panel.tab.fg" = "lightcyan"
"panel.tab.bg" = "blue"
"panel.tab.active.fg" = "#000000"
"panel.tab.active.bg" = "cyan"
"panel.column.fg" = "yellow"
"panel.scrollbar.fg" = "cyan"
"hmenu.fg" = "#000000"
"hmenu.bg" = "cyan"
"hmenu.selected.fg" = "bright"
"hmenu.selected.bg" = "#000000"
"hmenu.hotkey.fg" = "yellow"
"menu.fg" = "bright"
"menu.bg" = "cyan"
"menu.frame" = "bright"
"menu.title.fg" = "bright"
"menu.selected.fg" = "bright"
"menu.selected.bg" = "#000000"
"menu.hotkey.fg" = "yellow"
"menu.dim.fg" = "grey"
"dialog.edit.fg" = "#000000"
"dialog.edit.bg" = "cyan"
"dialog.button.fg" = "#000000"
"dialog.button.bg" = "white"
"dialog.button.selected.fg" = "#000000"
"dialog.button.selected.bg" = "cyan"
"help.heading.fg" = "#000080"
"help.code.fg" = "#800000"
"help.marker.fg" = "#000080"
"help.link.fg" = "#800080"
"help.frame.fg" = "grey"
"warn.fg" = "bright"
"warn.bg" = "#800000"
"warn.frame" = "bright"

# Viewer.Text / Viewer.Status / Viewer.Text.Selected, and the same three for the editor.
# In FAR's palette.cpp the two views carry the panel's own text colours and a status line that
# is the key bar's — Viewer.Status, Editor.Status and Keybar are one value there — so a theme
# answers these from what it already says about those two.
"viewer.fg" = "lightcyan"
"viewer.bg" = "blue"
"viewer.status.fg" = "#000000"
"viewer.status.bg" = "cyan"
"viewer.selected.fg" = "#000000"
"viewer.selected.bg" = "cyan"
"editor.fg" = "lightcyan"
"editor.bg" = "blue"
"editor.status.fg" = "#000000"
"editor.status.bg" = "cyan"
"editor.selected.fg" = "#000000"
"editor.selected.bg" = "cyan"

# Syntax, for the editor and the viewer: foregrounds only, on the editor's own
# background, so a coloured run never changes the colour of the page behind it.
"syntax.keyword" = "bright"
"syntax.type" = "lightcyan"
"syntax.string" = "green"
"syntax.number" = "magenta"
"syntax.comment" = "grey"
"syntax.preproc" = "yellow"
"syntax.tag" = "lightcyan"
"syntax.attr" = "yellow"
"syntax.entity" = "magenta"
"syntax.function" = "bright"
"syntax.text" = "lightcyan"
