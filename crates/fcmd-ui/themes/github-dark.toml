id = "github-dark"
name = "GitHub Dark"
author = "FinalCommander"
variant = "dark"
# GitHub's dark terminal palette, as terminalcolors.com publishes it
# (https://terminalcolors.com/themes/github/dark/, its Alacritty export, read 11 November 2026):
# the near-black #010409 ground, #e6edf3 text, the sixteen ANSI colours and the #264f78
# selection. The surfaces a terminal palette does not name — a dialog, a menu, a frame — take
# the greys of the same dark interface, #0d1117, #161b22 and #30363d.

[palette]
bg = "#010409"
canvas = "#0d1117"
surface = "#161b22"
border = "#30363d"
fg = "#e6edf3"
muted = "#b1bac4"
dim = "#6e7681"
selection = "#264f78"
black = "#484f58"
red = "#ff7b72"
green = "#3fb950"
yellow = "#d29922"
blue = "#58a6ff"
magenta = "#bc8cff"
cyan = "#39c5cf"
bright_red = "#ffa198"
bright_green = "#56d364"
bright_yellow = "#e3b341"
bright_blue = "#79c0ff"
bright_magenta = "#d2a8ff"
bright_cyan = "#56d4dd"
white = "#ffffff"

[colors]
"panel.bg" = "bg"
"panel.fg" = "fg"
"panel.frame" = "border"
"panel.header.fg" = "white"
"panel.header.bg" = "bg"
"panel.header.inactive.fg" = "dim"
"panel.footer.fg" = "muted"
"panel.info.selected.fg" = "bright_yellow"
"panel.info.selected.bg" = "surface"
"panel.title.active.fg" = "white"
"panel.title.active.bg" = "selection"
"panel.tab.fg" = "muted"
"panel.tab.bg" = "bg"
"panel.tab.active.fg" = "white"
"panel.tab.active.bg" = "selection"
"panel.column.fg" = "bright_blue"
"panel.scrollbar.fg" = "border"
"cursor.fg" = "white"
"cursor.bg" = "selection"
"cursor.inactive.fg" = "fg"
"cursor.inactive.bg" = "surface"
"selected.fg" = "bright_yellow"
"file.dir" = "bright_blue"
"file.exec" = "green"
"file.symlink" = "cyan"
"file.archive" = "red"
"file.hidden" = "dim"
"file.temp" = "dim"
"file.broken" = "bright_red"
"keybar.fg" = "fg"
"keybar.bg" = "surface"
"keybar.num.fg" = "bright_blue"
"keybar.num.bg" = "bg"
"keybar.background.fg" = "fg"
"keybar.background.bg" = "bg"
"status.fg" = "fg"
"status.bg" = "surface"

"viewer.fg" = "fg"
"viewer.bg" = "bg"
"viewer.status.fg" = "fg"
"viewer.status.bg" = "surface"
"viewer.selected.fg" = "white"
"viewer.selected.bg" = "selection"
"editor.fg" = "fg"
"editor.bg" = "bg"
"editor.status.fg" = "fg"
"editor.status.bg" = "surface"
"editor.selected.fg" = "white"
"editor.selected.bg" = "selection"

# The colours GitHub's own code view gives the same things: keywords red, names of types and
# constants blue, strings light blue, functions purple, comments grey.
"syntax.keyword" = "red"
"syntax.type" = "bright_blue"
"syntax.string" = "bright_blue"
"syntax.number" = "bright_blue"
"syntax.comment" = "dim"
"syntax.preproc" = "red"
"syntax.tag" = "bright_green"
"syntax.attr" = "bright_blue"
"syntax.entity" = "bright_magenta"
"syntax.function" = "bright_magenta"
"syntax.added" = "bright_green"
"syntax.removed" = "bright_red"
"syntax.text" = "fg"
"syntax.guide" = "border"
"diff.line.fg" = "fg"
"diff.removed.bg" = "#4b1818"
"diff.added.bg" = "#12361c"

"cmdline.fg" = "fg"
"cmdline.bg" = "bg"
"cmdline.hint.fg" = "dim"
"hmenu.fg" = "fg"
"hmenu.bg" = "surface"
"hmenu.selected.fg" = "white"
"hmenu.selected.bg" = "selection"
"hmenu.hotkey.fg" = "bright_yellow"
"menu.fg" = "fg"
"menu.bg" = "surface"
"menu.frame" = "border"
"menu.title.fg" = "white"
"menu.selected.fg" = "white"
"menu.selected.bg" = "selection"
"menu.hotkey.fg" = "bright_yellow"
"menu.dim.fg" = "dim"
"dialog.fg" = "fg"
"dialog.bg" = "surface"
"dialog.frame" = "border"
"dialog.title" = "white"
"dialog.edit.fg" = "fg"
"dialog.edit.bg" = "canvas"
"dialog.button.fg" = "fg"
"dialog.button.bg" = "border"
"dialog.button.selected.fg" = "white"
"dialog.button.selected.bg" = "selection"
"help.heading.fg" = "white"
"help.code.fg" = "bright_blue"
"help.marker.fg" = "dim"
"help.link.fg" = "blue"
"help.frame.fg" = "border"
"warn.fg" = "bright_yellow"
"warn.bg" = "surface"
"warn.frame" = "yellow"
"error.fg" = "bright_red"
"filter.fg" = "bright_yellow"
"search.fg" = "bright_yellow"

[styles]
"file.dir" = "bold"
"selected.fg" = "bold"
"syntax.comment" = "italic"
