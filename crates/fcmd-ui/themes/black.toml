id = "black"
name = "Black"
author = "FinalCommander"
variant = "dark"
# Black and nothing else behind the text: no bars, no boxes, no grey grounds. Every part of the
# screen is told apart by the colour and the weight of its text, and every colour is a light
# one — at least 7:1 against black for what is read, 4.5:1 for what is only glanced at. The
# cursor, which every other theme draws as a bar, is the brightest text on the screen, bold
# and underlined from one frame to the other.

[palette]
bg = "#000000"
fg = "#e6e6e6"
dim = "#a0a0a0"
frame = "#8a8a8a"
bright = "#ffffff"
cyan = "#8be9fd"
yellow = "#fff176"
green = "#7cfc8a"
orange = "#ffb86c"
red = "#ff7b7b"
magenta = "#ff9ff3"
blue = "#9ecbff"

[colors]
"panel.bg" = "bg"
"panel.fg" = "fg"
"panel.frame" = "frame"
"panel.header.fg" = "bright"
"panel.header.bg" = "bg"
"panel.header.inactive.fg" = "dim"
"panel.footer.fg" = "dim"
"panel.info.selected.fg" = "yellow"
"panel.info.selected.bg" = "bg"
"panel.title.active.fg" = "cyan"
"panel.title.active.bg" = "bg"
"panel.tab.fg" = "dim"
"panel.tab.bg" = "bg"
"panel.tab.active.fg" = "cyan"
"panel.tab.active.bg" = "bg"
"panel.column.fg" = "yellow"
"panel.scrollbar.fg" = "frame"
"cursor.fg" = "cyan"
"cursor.bg" = "bg"
"cursor.inactive.fg" = "fg"
"cursor.inactive.bg" = "bg"
"selected.fg" = "yellow"
"file.dir" = "bright"
"file.exec" = "green"
"file.symlink" = "cyan"
"file.archive" = "orange"
"file.hidden" = "dim"
"file.temp" = "dim"
"file.broken" = "red"
"keybar.fg" = "fg"
"keybar.bg" = "bg"
"keybar.num.fg" = "cyan"
"keybar.num.bg" = "bg"
"keybar.background.fg" = "fg"
"keybar.background.bg" = "bg"
"status.fg" = "fg"
"status.bg" = "bg"

# The viewer and the editor: the page is black, a search hit and a marked block are told by
# their text, yellow and underlined.
"viewer.fg" = "fg"
"viewer.bg" = "bg"
"viewer.status.fg" = "cyan"
"viewer.status.bg" = "bg"
"viewer.selected.fg" = "yellow"
"viewer.selected.bg" = "bg"
"editor.fg" = "fg"
"editor.bg" = "bg"
"editor.status.fg" = "cyan"
"editor.status.bg" = "bg"
"editor.selected.fg" = "yellow"
"editor.selected.bg" = "bg"

# Syntax: six light colours that are not mistaken for one another.
"syntax.keyword" = "yellow"
"syntax.type" = "cyan"
"syntax.string" = "green"
"syntax.number" = "magenta"
"syntax.comment" = "dim"
"syntax.preproc" = "blue"
"syntax.tag" = "cyan"
"syntax.attr" = "orange"
"syntax.entity" = "magenta"
"syntax.function" = "bright"
"syntax.added" = "green"
"syntax.removed" = "red"
"syntax.text" = "fg"
"syntax.guide" = "#8a8a8a"
# No painted lines in the side-by-side diff: with the two grounds the panel's own, the text
# is drawn in the added and removed colours instead.
"diff.line.fg" = "fg"
"diff.removed.bg" = "bg"
"diff.added.bg" = "bg"

"cmdline.fg" = "fg"
"cmdline.bg" = "bg"
"cmdline.hint.fg" = "dim"
"hmenu.fg" = "fg"
"hmenu.bg" = "bg"
"hmenu.selected.fg" = "cyan"
"hmenu.selected.bg" = "bg"
"hmenu.hotkey.fg" = "yellow"
"menu.fg" = "fg"
"menu.bg" = "bg"
"menu.frame" = "frame"
"menu.title.fg" = "bright"
"menu.selected.fg" = "cyan"
"menu.selected.bg" = "bg"
"menu.hotkey.fg" = "yellow"
"menu.dim.fg" = "dim"
"dialog.fg" = "fg"
"dialog.bg" = "bg"
"dialog.frame" = "frame"
"dialog.title" = "bright"
"dialog.edit.fg" = "bright"
"dialog.edit.bg" = "bg"
"dialog.button.fg" = "fg"
"dialog.button.bg" = "bg"
"dialog.button.selected.fg" = "cyan"
"dialog.button.selected.bg" = "bg"
"help.heading.fg" = "bright"
"help.code.fg" = "green"
"help.marker.fg" = "dim"
"help.link.fg" = "cyan"
"help.frame.fg" = "frame"
"warn.fg" = "yellow"
"warn.bg" = "bg"
"warn.frame" = "yellow"
"error.fg" = "red"
"filter.fg" = "yellow"
"search.fg" = "yellow"

# What carries the difference where the colour alone would not: the cursor and the active
# entries are bold and underlined, a field to type in is underlined, folders and marked files
# are bold, comments lean.
[styles]
"cursor.fg" = "bold underline"
"cursor.inactive.fg" = "underline"
"selected.fg" = "bold"
"file.dir" = "bold"
"panel.title.active.fg" = "bold"
"panel.tab.active.fg" = "bold underline"
"hmenu.selected.fg" = "bold underline"
"menu.selected.fg" = "bold underline"
"dialog.button.selected.fg" = "bold underline"
"dialog.edit.fg" = "underline"
"viewer.selected.fg" = "bold underline"
"editor.selected.fg" = "bold underline"
"syntax.keyword" = "bold"
"syntax.comment" = "italic"
