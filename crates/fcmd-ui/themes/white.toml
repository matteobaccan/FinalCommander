id = "white"
name = "White"
author = "FinalCommander"
variant = "light"
# Light theme for daylight, projectors and printed screenshots.

[palette]
bg = "#ffffff"
fg = "#1c1c1c"
dim = "#6c6c6c"
blue = "#0a3d91"
accent = "#1c3f94"
orange = "#a63d00"
red = "#b00020"
green = "#006644"
purple = "#6a1b9a"
rule = "#9aa0a6"

[colors]
"panel.bg" = "bg"
"panel.fg" = "fg"
"panel.frame" = "rule"
"panel.header.fg" = "blue"
"panel.header.bg" = "#eef1f5"
"panel.header.inactive.fg" = "dim"
"panel.footer.fg" = "dim"
"cursor.fg" = "bg"
"cursor.bg" = "accent"
"cursor.inactive.fg" = "fg"
"cursor.inactive.bg" = "#dfe4ea"
"selected.fg" = "orange"
"file.dir" = "blue"
"file.exec" = "green"
"file.symlink" = "purple"
"file.archive" = "purple"
"file.temp" = "dim"
"file.hidden" = "dim"
"file.broken" = "red"
"keybar.fg" = "bg"
"keybar.bg" = "accent"
"keybar.num.fg" = "fg"
"keybar.num.bg" = "#dfe4ea"
"keybar.background.fg" = "fg"
"keybar.background.bg" = "#dfe4ea"
"panel.info.selected.fg" = "bg"
"panel.info.selected.bg" = "#2f6f4f"
"status.fg" = "fg"
"status.bg" = "#eef1f5"
"cmdline.fg" = "fg"
"cmdline.bg" = "#f6f7f9"
"cmdline.hint.fg" = "dim"
"dialog.fg" = "fg"
"dialog.bg" = "#eef1f5"
"dialog.frame" = "rule"
"dialog.title" = "blue"
"error.fg" = "red"
"filter.fg" = "orange"
"search.fg" = "orange"
"panel.title.active.fg" = "bg"
"panel.title.active.bg" = "accent"
"panel.tab.fg" = "fg"
"panel.tab.bg" = "bg"
"panel.tab.active.fg" = "bg"
"panel.tab.active.bg" = "accent"
"panel.column.fg" = "blue"
"panel.scrollbar.fg" = "rule"
"hmenu.fg" = "bg"
"hmenu.bg" = "accent"
"hmenu.selected.fg" = "bg"
"hmenu.selected.bg" = "blue"
"hmenu.hotkey.fg" = "orange"
"menu.fg" = "fg"
"menu.bg" = "#eef1f5"
"menu.frame" = "rule"
"menu.title.fg" = "blue"
"menu.selected.fg" = "bg"
"menu.selected.bg" = "accent"
"menu.hotkey.fg" = "orange"
"menu.dim.fg" = "dim"
"dialog.edit.fg" = "fg"
"dialog.edit.bg" = "bg"
"dialog.button.fg" = "fg"
"dialog.button.bg" = "#dfe5ec"
"dialog.button.selected.fg" = "bg"
"dialog.button.selected.bg" = "accent"
"help.heading.fg" = "blue"
"help.code.fg" = "red"
"help.marker.fg" = "accent"
"help.link.fg" = "purple"
"help.frame.fg" = "rule"
"warn.fg" = "bg"
"warn.bg" = "red"
"warn.frame" = "bg"

# Viewer.Text / Viewer.Status / Viewer.Text.Selected, and the same three for the editor.
# In FAR's palette.cpp the two views carry the panel's own text colours and a status line that
# is the key bar's — Viewer.Status, Editor.Status and Keybar are one value there — so a theme
# answers these from what it already says about those two.
"viewer.fg" = "fg"
"viewer.bg" = "bg"
"viewer.status.fg" = "bg"
"viewer.status.bg" = "accent"
"viewer.selected.fg" = "bg"
"viewer.selected.bg" = "accent"
"editor.fg" = "fg"
"editor.bg" = "bg"
"editor.status.fg" = "bg"
"editor.status.bg" = "accent"
"editor.selected.fg" = "bg"
"editor.selected.bg" = "accent"

# Syntax, for the editor and the viewer: foregrounds only, on the editor's own
# background, so a coloured run never changes the colour of the page behind it.
"syntax.keyword" = "accent"
"syntax.type" = "blue"
"syntax.string" = "green"
"syntax.number" = "purple"
"syntax.comment" = "dim"
"syntax.preproc" = "orange"
"syntax.tag" = "blue"
"syntax.attr" = "orange"
"syntax.entity" = "purple"
"syntax.function" = "accent"
"syntax.text" = "fg"
