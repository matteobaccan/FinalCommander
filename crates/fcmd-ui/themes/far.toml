id = "far"
name = "FAR classic"
author = "FinalCommander"
variant = "dark"
# FAR Manager's own default palette, element for element, from `far/palette.cpp` of
# FarGroup/FarManager (BSD-3-Clause): blue panels with light cyan text, yellow for marked files
# and column titles, a cyan bar on the active panel's path, cyan menus with yellow hotkeys,
# light grey dialogs with cyan input fields, and red warning dialogs.
# The sixteen values are the console palette FAR inherits from the Windows console.

[palette]
black = "#000000"
blue = "#000080"
green = "#008000"
cyan = "#008080"
red = "#800000"
magenta = "#800080"
brown = "#808000"
lightgray = "#c0c0c0"
darkgray = "#808080"
lightblue = "#0000ff"
lightgreen = "#00ff00"
lightcyan = "#00ffff"
lightred = "#ff0000"
lightmagenta = "#ff00ff"
yellow = "#ffff00"
white = "#ffffff"

[colors]
# Panel.Text / Panel.Box / Panel.Title
"panel.bg" = "blue"
"panel.fg" = "lightcyan"
"panel.frame" = "lightcyan"
"panel.header.fg" = "lightcyan"
"panel.header.bg" = "blue"
"panel.header.inactive.fg" = "lightcyan"
# Panel.Title.Selected: the active panel's path, inverted
"panel.title.active.fg" = "black"
"panel.title.active.bg" = "cyan"
"panel.tab.fg" = "lightcyan"
"panel.tab.bg" = "blue"
"panel.tab.active.fg" = "black"
"panel.tab.active.bg" = "cyan"
# Panel.Title.Column, also the sort letter and the filter mark
"panel.column.fg" = "yellow"
# Panel.Info.Total
"panel.footer.fg" = "lightcyan"
"panel.scrollbar.fg" = "lightcyan"
# Panel.Cursor / Panel.Text.Selected
"cursor.fg" = "black"
"cursor.bg" = "cyan"
"cursor.inactive.fg" = "lightcyan"
"cursor.inactive.bg" = "blue"
"selected.fg" = "yellow"
# FAR's six default highlighting groups, colour for colour (`far/hilight.cpp`), in the order
# FAR applies them: hidden and system first, so a hidden directory is cyan rather than white.
"file.hidden" = "cyan"
"file.dir" = "white"
"file.exec" = "lightgreen"
"file.archive" = "lightmagenta"
"file.temp" = "brown"
# FAR has no group for either of these. A symlink therefore takes the ordinary file colour;
# a *broken* one is ours, because a dangling link is worth seeing on a Unix filesystem.
"file.symlink" = "lightcyan"
"file.broken" = "lightred"
# Keybar.Num / Keybar.Text
"keybar.fg" = "black"
"keybar.bg" = "cyan"
"keybar.num.fg" = "lightgray"
"keybar.num.bg" = "black"
"keybar.background.fg" = "lightgray"
"keybar.background.bg" = "black"
"panel.info.selected.fg" = "yellow"
"panel.info.selected.bg" = "cyan"
# HMenu.Text / HMenu.Text.Selected: the menu bar across the top
"hmenu.fg" = "black"
"hmenu.bg" = "cyan"
"hmenu.selected.fg" = "white"
"hmenu.selected.bg" = "black"
"hmenu.hotkey.fg" = "yellow"
# Menu.Text / Menu.Box / Menu.Highlight: a pulled-down menu or a list
"menu.fg" = "white"
"menu.bg" = "cyan"
"menu.frame" = "white"
"menu.title.fg" = "white"
"menu.selected.fg" = "white"
"menu.selected.bg" = "black"
"menu.hotkey.fg" = "yellow"
"menu.dim.fg" = "darkgray"
# Dialog.Text / Dialog.Box / Dialog.Edit / Dialog.Button
"dialog.fg" = "black"
"dialog.bg" = "lightgray"
"dialog.frame" = "black"
"dialog.title" = "black"
"dialog.edit.fg" = "black"
"dialog.edit.bg" = "cyan"
"dialog.button.fg" = "black"
"dialog.button.bg" = "lightgray"
"dialog.button.selected.fg" = "black"
"dialog.button.selected.bg" = "cyan"
# WarnDialog.*
"warn.fg" = "white"
"warn.bg" = "red"
"warn.frame" = "white"
# Viewer.Status / Editor.Status share the key bar's colours in FAR
"status.fg" = "black"
"status.bg" = "cyan"
"cmdline.fg" = "lightgray"
"cmdline.bg" = "black"
"error.fg" = "lightred"
"filter.fg" = "yellow"
"search.fg" = "yellow"

# Viewer.Text / Viewer.Status / Viewer.Text.Selected, and the same three for the editor.
# In FAR's palette.cpp the two views carry the panel's own text colours and a status line that
# is the key bar's — Viewer.Status, Editor.Status and Keybar are one value there — so a theme
# answers these from what it already says about those two.
"viewer.fg" = "lightcyan"
"viewer.bg" = "blue"
"viewer.status.fg" = "black"
"viewer.status.bg" = "cyan"
"viewer.selected.fg" = "black"
"viewer.selected.bg" = "cyan"
"editor.fg" = "lightcyan"
"editor.bg" = "blue"
"editor.status.fg" = "black"
"editor.status.bg" = "cyan"
"editor.selected.fg" = "black"
"editor.selected.bg" = "cyan"

# Syntax, for the editor and the viewer: foregrounds only, on the editor's own
# background, so a coloured run never changes the colour of the page behind it.
"syntax.keyword" = "white"
"syntax.type" = "lightcyan"
"syntax.string" = "lightgreen"
"syntax.number" = "lightmagenta"
"syntax.comment" = "darkgray"
"syntax.preproc" = "yellow"
"syntax.tag" = "lightcyan"
"syntax.attr" = "yellow"
"syntax.entity" = "lightmagenta"
"syntax.function" = "white"
"syntax.text" = "lightcyan"
