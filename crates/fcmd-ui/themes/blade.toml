id = "blade"
name = "Blade"
author = "FinalCommander"
variant = "dark"
# Rain at night: warm amber chrome, teal marks, almost-black background.

[palette]
bg = "#0b0a08"
fg = "#d9b37c"
dim = "#6b5636"
amber = "#ffb000"
cream = "#f2e3c6"
teal = "#7fd4c1"
red = "#e4572e"
smoke = "#4a4336"

[colors]
"panel.bg" = "bg"
"panel.fg" = "fg"
"panel.frame" = "dim"
"panel.header.fg" = "amber"
"panel.header.bg" = "#17130c"
"panel.header.inactive.fg" = "smoke"
"panel.footer.fg" = "smoke"
"cursor.fg" = "bg"
"cursor.bg" = "amber"
"cursor.inactive.fg" = "amber"
"cursor.inactive.bg" = "#241c10"
"selected.fg" = "teal"
"file.dir" = "cream"
"file.exec" = "#9ad67d"
"file.symlink" = "teal"
"file.archive" = "#e08f45"
"file.temp" = "smoke"
"file.hidden" = "smoke"
"file.broken" = "red"
"keybar.fg" = "bg"
"keybar.bg" = "amber"
"keybar.num.fg" = "fg"
"keybar.num.bg" = "bg"
"keybar.background.fg" = "fg"
"keybar.background.bg" = "bg"
"panel.info.selected.fg" = "bg"
"panel.info.selected.bg" = "amber"
"status.fg" = "cream"
"status.bg" = "#17130c"
"cmdline.fg" = "fg"
"cmdline.bg" = "bg"
"dialog.fg" = "cream"
"dialog.bg" = "#241c10"
"dialog.frame" = "amber"
"dialog.title" = "teal"
"error.fg" = "red"
"filter.fg" = "teal"
"search.fg" = "teal"
"panel.title.active.fg" = "bg"
"panel.title.active.bg" = "amber"
"panel.tab.fg" = "fg"
"panel.tab.bg" = "bg"
"panel.tab.active.fg" = "bg"
"panel.tab.active.bg" = "amber"
"panel.column.fg" = "teal"
"panel.scrollbar.fg" = "dim"
"hmenu.fg" = "bg"
"hmenu.bg" = "amber"
"hmenu.selected.fg" = "cream"
"hmenu.selected.bg" = "bg"
"hmenu.hotkey.fg" = "teal"
"menu.fg" = "cream"
"menu.bg" = "#241c10"
"menu.frame" = "amber"
"menu.title.fg" = "teal"
"menu.selected.fg" = "bg"
"menu.selected.bg" = "amber"
"menu.hotkey.fg" = "teal"
"menu.dim.fg" = "smoke"
"dialog.edit.fg" = "cream"
"dialog.edit.bg" = "#17130c"
"dialog.button.fg" = "cream"
"dialog.button.bg" = "#2f2415"
"dialog.button.selected.fg" = "bg"
"dialog.button.selected.bg" = "amber"
"warn.fg" = "cream"
"warn.bg" = "#3a1208"
"warn.frame" = "red"

# Viewer.Text / Viewer.Status / Viewer.Text.Selected, and the same three for the editor.
# In FAR's palette.cpp the two views carry the panel's own text colours and a status line that
# is the key bar's — Viewer.Status, Editor.Status and Keybar are one value there — so a theme
# answers these from what it already says about those two.
"viewer.fg" = "fg"
"viewer.bg" = "bg"
"viewer.status.fg" = "bg"
"viewer.status.bg" = "amber"
"viewer.selected.fg" = "bg"
"viewer.selected.bg" = "amber"
"editor.fg" = "fg"
"editor.bg" = "bg"
"editor.status.fg" = "bg"
"editor.status.bg" = "amber"
"editor.selected.fg" = "bg"
"editor.selected.bg" = "amber"

# Syntax, for the editor and the viewer: foregrounds only, on the editor's own
# background, so a coloured run never changes the colour of the page behind it.
"syntax.keyword" = "cream"
"syntax.type" = "teal"
"syntax.string" = "#c9d98f"
"syntax.number" = "amber"
"syntax.comment" = "smoke"
"syntax.preproc" = "amber"
"syntax.tag" = "teal"
"syntax.attr" = "amber"
"syntax.entity" = "red"
"syntax.function" = "cream"
"syntax.text" = "fg"
