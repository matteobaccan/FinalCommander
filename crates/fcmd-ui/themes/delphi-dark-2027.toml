id = "delphi-dark-2027"
name = "Delphi Dark 2027"
author = "FinalCommander"
variant = "dark"
# The dark theme of the Delphi IDE, read off its own editor: a charcoal page, light grey text,
# reserved words in a cream bold, comments olive and slanted, `{$…}` directives azure and set
# apart from the comments, strings blue, numbers pink; a cornflower selection across the whole
# row and a near-black blue line under the cursor. The rest of the screen — panels, menus,
# dialogs — takes the IDE's own chrome: dark greys and its blue.
#
# The page and the code were measured against the IDE itself: a background with a touch of blue
# in it (#2e3034, not a neutral grey) and a near-black line under the cursor (#08141c),
# identifiers in pure white rather than the light grey of the chrome — most of what makes the
# IDE's code look sharp is that contrast — and comments the light green its colour dialog gives
# for the Dark setting (188, 231, 132), in italics.

[palette]
bg = "#2e3034"
chrome = "#252526"
surface = "#2d2d30"
border = "#4a4a4f"
fg = "#dcdcdc"
code = "#ffffff"
dim = "#808080"
bright = "#ffffff"
blue = "#1e4f7a"
cursorline = "#08141c"
selection = "#7fa6f2"
ink = "#101828"
cream = "#f0dcbe"
olive = "#bce784"
azure = "#6cb4e8"
string = "#5a9be6"
pink = "#e87bb0"
red = "#e05050"
green = "#7cc47c"
amber = "#e0b060"

[colors]
"panel.bg" = "bg"
"panel.fg" = "fg"
"panel.frame" = "border"
"panel.header.fg" = "bright"
"panel.header.bg" = "bg"
"panel.header.inactive.fg" = "dim"
"panel.footer.fg" = "dim"
"panel.info.selected.fg" = "cream"
"panel.info.selected.bg" = "surface"
"panel.title.active.fg" = "bright"
"panel.title.active.bg" = "blue"
"panel.tab.fg" = "dim"
"panel.tab.bg" = "chrome"
"panel.tab.active.fg" = "bright"
"panel.tab.active.bg" = "blue"
"panel.column.fg" = "azure"
"panel.scrollbar.fg" = "border"
"cursor.fg" = "bright"
"cursor.bg" = "cursorline"
"cursor.inactive.fg" = "fg"
"cursor.inactive.bg" = "surface"
"selected.fg" = "cream"
"file.dir" = "bright"
"file.exec" = "green"
"file.symlink" = "azure"
"file.archive" = "pink"
"file.hidden" = "dim"
"file.temp" = "dim"
"file.broken" = "red"
"keybar.fg" = "fg"
"keybar.bg" = "surface"
"keybar.num.fg" = "azure"
"keybar.num.bg" = "chrome"
"keybar.background.fg" = "fg"
"keybar.background.bg" = "chrome"
"status.fg" = "fg"
"status.bg" = "chrome"

# The editor's page. A marked block and a search hit are the IDE's cornflower, with dark text
# on it so a line stays readable.
"viewer.fg" = "code"
"viewer.bg" = "bg"
"viewer.status.fg" = "fg"
"viewer.status.bg" = "blue"
"viewer.selected.fg" = "ink"
"viewer.selected.bg" = "selection"
"editor.fg" = "code"
"editor.bg" = "bg"
"editor.status.fg" = "fg"
"editor.status.bg" = "blue"
"editor.selected.fg" = "ink"
"editor.selected.bg" = "selection"

# The IDE's syntax colours, for every language and not only Pascal: names and calls stay the
# code's white, as they do there.
"syntax.keyword" = "cream"
"syntax.type" = "code"
"syntax.string" = "string"
"syntax.number" = "pink"
"syntax.comment" = "olive"
"syntax.preproc" = "azure"
"syntax.tag" = "cream"
"syntax.attr" = "azure"
"syntax.entity" = "pink"
"syntax.function" = "code"
"syntax.added" = "green"
"syntax.removed" = "red"
"syntax.text" = "code"
"syntax.guide" = "#4a5a70"
"diff.line.fg" = "fg"
"diff.removed.bg" = "#4a2020"
"diff.added.bg" = "#1f3a24"

"cmdline.fg" = "fg"
"cmdline.bg" = "bg"
"cmdline.hint.fg" = "dim"
"hmenu.fg" = "fg"
"hmenu.bg" = "chrome"
"hmenu.selected.fg" = "bright"
"hmenu.selected.bg" = "blue"
"hmenu.hotkey.fg" = "amber"
"menu.fg" = "fg"
"menu.bg" = "surface"
"menu.frame" = "border"
"menu.title.fg" = "bright"
"menu.selected.fg" = "bright"
"menu.selected.bg" = "blue"
"menu.hotkey.fg" = "amber"
"menu.dim.fg" = "dim"
"dialog.fg" = "fg"
"dialog.bg" = "surface"
"dialog.frame" = "border"
"dialog.title" = "bright"
"dialog.edit.fg" = "fg"
"dialog.edit.bg" = "chrome"
"dialog.button.fg" = "fg"
"dialog.button.bg" = "border"
"dialog.button.selected.fg" = "bright"
"dialog.button.selected.bg" = "blue"
"help.heading.fg" = "cream"
"help.code.fg" = "string"
"help.marker.fg" = "dim"
"help.link.fg" = "azure"
"help.frame.fg" = "border"
"warn.fg" = "amber"
"warn.bg" = "surface"
"warn.frame" = "amber"
"error.fg" = "red"
"filter.fg" = "cream"
"search.fg" = "cream"

[styles]
"syntax.keyword" = "bold"
"syntax.tag" = "bold"
"syntax.comment" = "italic"
"selected.fg" = "bold"
"file.dir" = "bold"
