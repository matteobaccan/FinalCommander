[package]
name = "scmd-jobs"
description = "SupremeCommander: the file operation engine (plan, execute, settle)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
scmd-arc = { workspace = true }
scmd-core = { workspace = true }
regex = "1"
thiserror = "2"
trash = { version = "5.2.9", default-features = false }

[dev-dependencies]
tempfile = "3"
# Only to build the archive a test then reads through the engine.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
