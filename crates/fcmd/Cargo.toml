[package]
name = "fcmd"
description = "FinalCommander: a cross-platform orthodox file manager for the terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# A 64-bit atomic counter on every processor: the standard one does not exist on 32-bit MIPS,
# where this one takes a lock instead; everywhere else it is the standard one. MIT OR Apache-2.0.
portable-atomic = { version = "1", features = ["fallback"] }
thiserror = "2"
toml = "1.0.7"
anyhow = "1.0.104"
fcmd-arc = { workspace = true }
fcmd-cmd = { workspace = true }
fcmd-config = { workspace = true }
fcmd-core = { workspace = true }
fcmd-edit = { workspace = true }
fcmd-find = { workspace = true }
fcmd-i18n = { workspace = true }
fcmd-jobs = { workspace = true }
fcmd-net = { workspace = true }
fcmd-platform = { workspace = true }
fcmd-plug = { workspace = true }
fcmd-s3 = { workspace = true }
fcmd-tui = { workspace = true }
fcmd-ui = { workspace = true }
fcmd-vfs = { workspace = true }
fcmd-syntax = { workspace = true }
fcmd-term = { workspace = true }
fcmd-view = { workspace = true }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "fs", "sync", "time", "macros", "net"] }
# The Link's called side implements fcmd-net's `Gate`, an async trait: already in the tree.
async-trait = "0.1"
unicode-width = "0.2.2"
# The secrets file (`vault.rs`): AES-256-GCM and PBKDF2. Already in the tree under russh and
# fcmd-s3, so this is no new code to trust, only a direct use of it.
ring = "0.17"
serde_json = "1.0.154"
# The filesystem watch behind `panel.auto_refresh` (feature 1.25): inotify on Linux,
# FSEvents on macOS, `ReadDirectoryChangesW` on Windows, which is three platform APIs we
# are not going to write three times. CC0-1.0, no runtime of its own.
notify = { version = "9.0.0", default-features = false, features = ["macos_fsevent"] }
# SHA-1, for the one thing that still asks for it: the answer to a WebSocket's handshake
# (`--web-terminal`, RFC 6455 §4.2.2). The same crate `fcmd-jobs` hashes `.sha1` files with.
sha1 = { version = "0.11", optional = true }

# Free space in the panel frame needs `statvfs`, which `std` does not expose. Unix only:
# Windows wants `GetDiskFreeSpaceEx` and gets its own answer when it gets its own crate.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.32.0", features = ["fs"] }

[features]
# Everything, which is what every build but one has. The compact build for small machines —
# a router's few megabytes of flash — is `--no-default-features`: English alone, and none of
# WebAssembly, pictures, the x86 disassembler, SQLite or the web terminal; each of those, left
# out, says so where it would have been.
default = ["full"]
full = [
  "webterm",
  "all-languages",
  "fcmd-view/wasm",
  "fcmd-view/pictures",
  "fcmd-view/disasm-x86",
  "fcmd-arc/sqlite",
]
webterm = ["dep:sha1"]
all-languages = ["fcmd-i18n/all-languages"]

[dev-dependencies]
# The same crate again, with the in-process S3 service switched on: an object the viewer
# fetches has to come from somewhere, and it must not be someone's account.
fcmd-s3 = { workspace = true, features = ["fake"] }
tempfile = "3.27.0"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
