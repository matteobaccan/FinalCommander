# A form rather than a blank box, because the four things that make a report actionable —
# the version, the platform, the keymap and the keys pressed — are the four things nobody
# remembers to include. Every field here has been needed to track something down already.
name: Something is wrong
description: A key does the wrong thing, something looks wrong, or it stopped answering
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for trying it. Please paste the output of `scmd --version` and, if the
        problem is about keys or settings, of `scmd --paths` — they answer half the questions
        before they are asked.

  - type: input
    id: version
    attributes:
      label: Version
      description: "`scmd --version`, or the name of the archive you unpacked"
      placeholder: scmd 0.1.0
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows
        - Something else
    validations:
      required: true

  - type: input
    id: terminal
    attributes:
      label: Terminal
      description: Which terminal, and its size if that matters
      placeholder: kitty, 120×40

  - type: dropdown
    id: keymap
    attributes:
      label: Keymap
      description: "`scmd --dump-config` prints this as `ui.keymap`"
      options:
        - far (the default)
        - mc
        - one of my own
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead
      placeholder: |
        I pressed F5 on a selected directory with the other panel on a server.
        I expected the copy dialog; the status line said "nothing to do".
    validations:
      required: true

  - type: textarea
    id: keys
    attributes:
      label: The keys, in order
      description: >
        The quickest thing to act on. If a macro or a plugin was involved, say so —
        `scmd --paths` names the files they live in.
      placeholder: |
        Tab, Alt+N, Enter on the first site, Tab, Insert, F5
      render: text

  - type: textarea
    id: screen
    attributes:
      label: What the screen looked like
      description: >
        A screenshot, or the text selected out of the terminal. The function-key bar along the
        bottom is worth including: it says what the keys did at that moment.
