# Build the project's site and publish it on GitHub Pages.
#
# The site is generated by `scmd-site`, a crate in this workspace: it reads the repository's own
# documents (`README.md`, `CHANGELOG.md`, `docs/00-landscape.md`, `docs/help/*.md`) and the
# screenshots the renderer draws (`docs/shots/*.svg`) and writes static HTML. Nothing is
# hand-maintained twice, so a page cannot drift from the document it came from.
#
# Two things to know:
#   * every push builds the site, because a generator that stops compiling or a document whose
#     section was renamed has to fail here rather than silently publish a page with a hole in
#     it. Only the default branch publishes; a development branch builds and stops;
#   * publishing needs Pages switched on for the repository with "GitHub Actions" as the source
#     (Settings → Pages). Until that is done the deploy step refuses with a 404, which is not a
#     mistake in this file. `workflow_dispatch` publishes from whatever branch it runs on, for
#     the first publication or to look at the site before the branch is merged.
name: Pages

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --quiet -p scmd-site -- --out site
      # A site that lost its landing page or its help is not worth publishing.
      - name: Check what was written
        run: |
          set -eu
          for page in index.html download.html changelog.html commanders.html help/index.html; do
            test -s "site/$page" || { echo "site/$page is missing or empty"; exit 1; }
          done
          echo "$(find site -name '*.html' | wc -l) pages, $(du -sh site | cut -f1)"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  publish:
    name: Publish
    needs: build
    # Only one branch owns the published site, and a manual run says so explicitly.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
