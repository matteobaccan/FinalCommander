# Create the tag for a release, and let `release.yml` build and publish it.
#
# Why this exists: a tag cannot always be pushed from where the work is done (an egress policy
# that allows `refs/heads/*` and refuses `refs/tags/*` is a common one), while a workflow's own
# token can create one. So the commit that cuts a release says so in two places — the version in
# `Cargo.toml` and a dated heading in `CHANGELOG.md` — and this turns that into the tag.
#
# It is deliberately hard to fire by accident:
#   * the version must have a *dated* heading in the changelog (`## [0.0.3] — 2026-10-24`), so a
#     bump on its own, or an `## [Unreleased]` section, does nothing;
#   * a tag that already exists is never moved or replaced;
#   * only the default branch and the development branches are watched;
#   * CI on that very commit must be green first — a push that fires this waits for the build
#     on all three platforms, and a failure refuses to tag.
# `workflow_dispatch` takes a version and a commit explicitly, for a release that was missed at
# the time: by then the branch has moved on, and a tag has to go where the release was cut, not
# where the work has got to since.
#
# One thing to know about that dispatch: start it from the Actions tab, not through the REST
# API with an app's token. A run dispatched by an app gets a token limited by that app's own
# permissions, so `contents: write` here is capped and creating the tag comes back
# `Resource not accessible by integration (HTTP 403)` — which looks like a mistake in this
# file and is not one. A push does not have that problem, which is why the ordinary path is a
# push that changes `Cargo.toml` and `CHANGELOG.md`.
name: Tag

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "Cargo.toml"
      - "CHANGELOG.md"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag (default: whatever Cargo.toml says)"
        required: false
        type: string
      sha:
        description: "Commit to tag (default: the head of the branch this runs on)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  tag:
    name: Tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Reading whether CI passed is an Actions read, and a job with an explicit permissions
      # block gets only what it lists: without this the poll below is refused, swallows the
      # refusal, and times out thirty minutes later having tagged nothing.
      actions: read
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
      created: ${{ steps.decide.outputs.created }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # A dispatch may name the commit the release was cut at; a push is its own commit.
          ref: ${{ inputs.sha || github.sha }}

      # 0.0.6 went out while the build on the other two platforms was still saying it had a
      # bug, because nothing here waited for it. Now the tag waits for CI on this very commit:
      # a failure refuses to tag, and a run that never appears (a push that CI does not watch)
      # times out rather than releasing on no evidence at all.
      - name: Wait for CI on this commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            # The query is kept, and so is its error: a token that cannot read the run is a
            # configuration mistake, and waiting half an hour to find that out is no way to
            # learn it.
            if ! answer=$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=1" \
              --jq '.workflow_runs[0] | "\(.status) \(.conclusion)"' 2>&1); then
              echo "cannot read the CI run for $GITHUB_SHA: $answer" >&2
              exit 1
            fi
            read -r status conclusion <<<"${answer:-none none}"
            echo "attempt $attempt: CI is $status/$conclusion"
            case "$status" in
              completed)
                if [ "$conclusion" = "success" ]; then
                  echo "CI is green; tagging."
                  exit 0
                fi
                echo "CI concluded $conclusion — refusing to tag a release nobody can build." >&2
                exit 1
                ;;
            esac
            sleep 30
          done
          echo "CI on $GITHUB_SHA did not finish in 30 minutes — not tagging." >&2
          exit 1

      - name: Which version, and is it ready to tag
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          ASKED: ${{ inputs.version }}
          ASKED_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          # What the tag will point at: the commit asked for, else this run's own.
          target="${ASKED_SHA:-$GITHUB_SHA}"
          target=$(git rev-parse "$target")
          echo "tagging $target"
          version="${ASKED#v}"
          if [ -z "$version" ]; then
            version=$(awk '/^\[workspace\.package\]/ { inside = 1; next }
                           inside && /^\[/ { exit }
                           inside && /^version[[:space:]]*=/ {
                             gsub(/[^0-9A-Za-z.+-]/, "", $3); print $3; exit }' Cargo.toml)
          fi
          if [ -z "$version" ]; then
            echo "no version in Cargo.toml" >&2
            exit 1
          fi
          echo "version: $version"

          # A dated heading is the signal that this version is finished. `## [Unreleased]` and a
          # heading with no date are both "not yet".
          if ! grep -qE "^## \[${version//./\\.}\][[:space:]]+[—-]" CHANGELOG.md; then
            echo "CHANGELOG.md has no dated heading for $version — nothing to tag."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag exists already; leaving it alone."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # An annotated tag, with the changelog's own first line as its message.
          summary=$(awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## / { exit }
            found && NF { print; exit }
          ' CHANGELOG.md)
          [ -n "$summary" ] || summary="$tag"

          object=$(gh api "repos/$GITHUB_REPOSITORY/git/tags" \
            -f tag="$tag" \
            -f message="$tag — $summary" \
            -f object="$target" \
            -f type=commit \
            -f tagger[name]="Matteo Baccan" \
            -f tagger[email]="matteo.baccan@gmail.com" \
            --jq .sha)
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$tag" \
            -f sha="$object" >/dev/null
          echo "created $tag at $target"
          echo "created=true" >> "$GITHUB_OUTPUT"

  release:
    name: Release
    needs: tag
    if: needs.tag.outputs.created == 'true'
    # A tag created with the workflow's own token does not start another workflow, so the
    # release is called rather than waited for.
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
    with:
      tag: ${{ needs.tag.outputs.tag }}
