# Build the executables for a tag and publish them as a GitHub Release.
#
# `workflow_dispatch` builds and uploads the artifacts without publishing anything, so the
# workflow itself can be tested without cutting a release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (empty: build the archives, publish nothing)"
        required: false
        type: string
  # Called by `tag.yml` right after it creates a tag: a tag created with a workflow's own token
  # does not start a workflow of its own.
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # What this run is releasing: the tag it was called or dispatched with, else the tag that was
  # pushed. Empty means "no tag", which builds the archives and publishes nothing.
  TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # Statically linked: one file that runs on any glibc or musl distribution.
          - name: linux-x86_64-static
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          # The same, for ARM: a Raspberry Pi, an ARM server, and the Linux that runs
          # inside a browser tab (a kernel built for WebAssembly runs aarch64 programs as
          # they are). Built on an ARM runner, so nothing is cross-compiled.
          - name: linux-aarch64-static
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          # 32-bit ARM (ARMv7 with hardware floating point): the older Raspberry Pi and
          # the boards and routers that run a 32-bit Linux. GitHub has no such runner, so
          # this one is cross-compiled with Zig's C compiler and linker (for `ring`'s C),
          # and tried under QEMU.
          - name: linux-armv7-static
            os: ubuntu-latest
            target: armv7-unknown-linux-musleabihf
            zig: true
            qemu: qemu-arm
          # 32-bit x86: old PCs, and iSH, which runs Alpine Linux on an iPad or an iPhone by
          # emulating a 32-bit Intel processor. Cross-compiled with Zig like the one above;
          # the runner's kernel runs it as it is.
          - name: linux-i686-static
            os: ubuntu-latest
            target: i686-unknown-linux-musl
            zig: true
          # 32-bit MIPS, little-endian (mipsel): routers and boards on MediaTek MT7621 and
          # its kin, with soft floating point. Rust ships no standard library for it (a tier 3
          # target), so it is compiled here from rust-src by the same 1.100.0
          # (`-Zbuild-std`, allowed on a stable compiler by RUSTC_BOOTSTRAP), and optimised
          # for size: flash on a router is counted in megabytes.
          - name: linux-mipsel-static
            os: ubuntu-latest
            target: mipsel-unknown-linux-musl
            zig: true
            build_std: true
            qemu: qemu-mipsel
          # One binary for both Intel and Apple Silicon.
          - name: macos-universal
            os: macos-latest
            target: universal-apple-darwin
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
        with:
          # `env.TAG` is not available to `with:`, so the expression is repeated; with no tag
          # the run builds whatever it was started on.
          ref: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || github.sha }}
      # The Rust of rust-toolchain.toml, installed as that file says.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Install the musl toolchain
        if: endsWith(matrix.target, '-linux-musl') && !matrix.zig
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add ${{ matrix.target }}

      - name: Install Zig, cargo-zigbuild and QEMU
        if: matrix.zig
        run: |
          if [ "${{ matrix.build_std }}" = true ]; then
            rustup component add rust-src
          else
            rustup target add ${{ matrix.target }}
          fi
          pip install ziglang cargo-zigbuild
          sudo apt-get update
          sudo apt-get install -y qemu-user

      - name: Build with Zig
        if: matrix.zig && !matrix.build_std
        run: cargo zigbuild --release --locked --target ${{ matrix.target }} -p fcmd

      - name: Build with Zig, the standard library included
        if: matrix.build_std
        env:
          RUSTC_BOOTSTRAP: "1"
          CARGO_PROFILE_RELEASE_OPT_LEVEL: z
        run: >
          cargo zigbuild --release --locked --target ${{ matrix.target }} -p fcmd
          -Zbuild-std=std,panic_abort

      - name: Build
        if: matrix.name != 'macos-universal' && !matrix.zig
        shell: bash
        env:
          # `ring` compiles C, and the musl target needs its own compiler.
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked --target ${{ matrix.target }} -p fcmd

      - name: Build both architectures and join them
        if: matrix.name == 'macos-universal'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --locked --target aarch64-apple-darwin -p fcmd
          cargo build --release --locked --target x86_64-apple-darwin -p fcmd
          mkdir -p target/universal-apple-darwin/release
          lipo -create -output target/universal-apple-darwin/release/fcmd \
            target/aarch64-apple-darwin/release/fcmd \
            target/x86_64-apple-darwin/release/fcmd
          lipo -info target/universal-apple-darwin/release/fcmd

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if [ -z "$version" ]; then
            # No tag: the workspace version, so a dispatch run packages something sensible.
            version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          fi
          # The platform first and the version last, so the archives of one release sort by
          # platform and a download is read left to right: what it runs on, then which build.
          # The project's name, not the command's: this is what somebody downloads and keeps
          # in a folder of downloads, where `fcmd-windows-x86_64-0.5.0.zip` says less about
          # what it is than the name on the page it came from. The executable inside is
          # `fcmd`, which is what gets typed.
          name="FinalCommander-${{ matrix.name }}-${version}"
          dir="dist/${name}"
          mkdir -p "$dir"
          bin="target/${{ matrix.target }}/release/fcmd"
          # `set -e` and `[ ... ] && ...` do not mix: a false test would end the script.
          if [ -f "$bin.exe" ]; then
            bin="$bin.exe"
          fi
          cp "$bin" "$dir/"
          cp README.md LICENSE THIRD-PARTY.md CHANGELOG.md "$dir/"
          # The manual page, for whoever installs this the Unix way. It is generated from the
          # command line's own options and a test keeps the two equal, so this is a copy and
          # not a second source of truth.
          case "${{ matrix.name }}" in
            windows-*) ;;
            *) cp docs/fcmd.1 "$dir/" ;;
          esac
          # The binary must at least run on the machine that built it, or under QEMU for
          # the one built for another processor.
          case "${{ matrix.name }}" in
            windows-*) "$dir/fcmd.exe" --version ;;
            linux-armv7-* | linux-mipsel-*) ${{ matrix.qemu }} "$dir/fcmd" --version ;;
            *) "$dir/fcmd" --version ;;
          esac
          # And on Windows it must not need the Visual C++ Redistributable: the C runtime is
          # linked in (`.cargo/config.toml`), and an import of VCRUNTIME140.dll would mean it
          # came back as a DLL — `fcmd.exe` would not start on a fresh Windows.
          case "${{ matrix.name }}" in
            windows-*) python tools/pe-imports.py "$dir/fcmd.exe" --static ;;
          esac
          # A static build that asks for a shared library is not one: it would not start on
          # a distribution without that library, nor inside a Linux with no libraries at all.
          case "${{ matrix.name }}" in
            *-static)
              if readelf -d "$dir/fcmd" | grep -q NEEDED; then
                readelf -d "$dir/fcmd" | grep NEEDED
                echo "$dir/fcmd is not statically linked" >&2
                exit 1
              fi
              ;;
          esac
          # The files sit at the root of the archive, with no directory of their own: the
          # program is one executable, and unpacking it should put that executable where the
          # user is, not one level down.
          if [ "${{ runner.os }}" = "Windows" ]; then
            (cd "$dir" && 7z a -tzip "../${name}.zip" ./* > /dev/null)
            echo "archive=dist/${name}.zip" >> "$GITHUB_OUTPUT"
          else
            (cd "$dir" && tar czf "../${name}.tar.gz" ./*)
            echo "archive=dist/${name}.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      # What went in, in the log. Answering "is the manual page in there" by downloading the
      # release and unpacking it is a silly way to spend ten minutes.
      - name: What is in the archive
        shell: bash
        run: |
          set -euo pipefail
          archive="${{ steps.package.outputs.archive }}"
          ls -l "$archive"
          case "$archive" in
            *.zip) 7z l "$archive" ;;
            *) tar tzvf "$archive" ;;
          esac

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

  # Android: the executable for Termux and the app, for 64-bit and 32-bit ARM phones,
  # built by android.yml (its `apk` job, whose artifacts the publish step merges with the
  # others).
  android:
    name: Android
    uses: ./.github/workflows/android.yml
    with:
      release: true
      ref: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || github.sha }}

  publish:
    name: Publish the release
    needs: [build, android]
    # Only a run that knows which tag it is for publishes anything.
    if: inputs.tag != '' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # The installer, beside the archives it downloads, so that
      # releases/latest/download/install.sh is always the latest one.
      - name: The installer
        run: cp install.sh dist/

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Release notes from the changelog
        run: |
          # The downloads first, then the version's section of CHANGELOG.md under "What's
          # new": its summary paragraph, then what was added, changed and fixed.
          if ! bash tools/release-notes.sh "$TAG" CHANGELOG.md > notes.md; then
            echo "See CHANGELOG.md." > notes.md
          fi
          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The tag may arrive from `git push`, from `tag.yml`, or from a release created in the
          # web interface. Either way this ends with one release carrying every archive.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file notes.md \
              dist/*
          fi
