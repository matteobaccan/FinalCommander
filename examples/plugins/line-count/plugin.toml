# What `cloc` answers, without `cloc`: how much code is here and in what. Counted by extension,
# with the directories nobody wrote by hand left out — node_modules, vendor, target, .git — and
# binaries skipped rather than counted as one enormous line.
[plugin]
id = "line-count"
name = "Lines of code"
fcmd = ">=0.1.0"

[[command]]
id = "user.lines.here"
label = "Count the lines under here, by kind"
run = "lines.sh"
needs = ["panel"]
timeout = 300

[command.when]
local = true

# And the same count per file, as a panel column: `{ type = "plugin:line-count.lines" }` in a
# `[[column_set]]` of fcmd.toml. One run for the whole directory, because starting a shell
# four hundred times to count four hundred files is most of the work.
[[column]]
id = "lines"
title = "Lines"
width = 7
align = "right"
run = "count.sh"
batch = true
timeout = 60
