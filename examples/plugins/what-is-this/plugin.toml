# Total Commander's content plugins (WDX) put this in panel columns — the ID3 tag, the EXIF
# date, the dimensions of a picture. The command says all of it in a message, from whatever
# is installed; the column at the bottom says the first line of it beside every file.
[plugin]
id = "what-is-this"
name = "What is this"
fcmd = ">=0.1.0"

[[command]]
id = "user.info.what"
label = "What is this file, really"
run = "what.sh"
needs = ["panel", "cursor"]
timeout = 30

[command.when]
local = true
files = true

# `{ type = "plugin:what-is-this.kind", width = 24 }` in a `[[column_set]]` of fcmd.toml.
# One file per run: the path is the first argument and the first line printed is the cell.
[[column]]
id = "kind"
title = "Kind"
width = 20
run = "kind.sh"
timeout = 5
