# cargo-deny: licence and advisory policy (see docs/01-licensing.md §5)
[licenses]
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
  "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "MPL-2.0", "CC0-1.0", "Unlicense",
  # Julian Seward's own licence for bzip2, carried by `libbz2-rs-sys` — the pure-Rust bzip2
  # that lets us read and write `.tar.bz2` without a C toolchain. It is a BSD-style
  # permissive licence: use, modify and redistribute in source or binary form, keep the
  # notice, no warranty, and no use of the author's name to endorse. Debian and Fedora both
  # treat it as free. Nothing in it reaches the user of the binary beyond the notice, which
  # `THIRD-PARTY.md` carries.
  "bzip2-1.0.6",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
# No copyleft in the default feature set.
deny = []

[advisories]
yanked = "deny"
# Advisories we carry knowingly, each with a reason and a way out.
ignore = [
  # RUSTSEC-2023-0071: a timing side channel in `rsa` (the Marvin attack) with no fixed
  # version. It reaches us only through `russh`'s `rsa` feature, which is what lets the netbox
  # use RSA keys and verify `ssh-rsa` host keys — still the only option on plenty of servers.
  # The attack needs an oracle that performs many RSA *decryptions* with the same private key;
  # an SSH client signs with its key and never decrypts for an attacker, so there is nothing
  # to measure. It goes away when `rsa` ships a constant-time implementation, or sooner if we
  # drop the feature (and with it RSA support).
  { id = "RUSTSEC-2023-0071", reason = "timing side channel in RSA decryption; the netbox only signs" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
