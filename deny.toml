# cargo-deny: licence and advisory policy (see docs/01-licensing.md §5)
[licenses]
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
  "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "MPL-2.0", "CC0-1.0", "Unlicense",
  # Julian Seward's own licence for bzip2, carried by `libbz2-rs-sys` — the pure-Rust bzip2
  # that lets us read and write `.tar.bz2` without a C toolchain. It is a BSD-style
  # permissive licence: use, modify and redistribute in source or binary form, keep the
  # notice, no warranty, and no use of the author's name to endorse. Debian and Fedora both
  # treat it as free. Nothing in it reaches the user of the binary beyond the notice, which
  # `THIRD-PARTY.md` carries.
  "bzip2-1.0.6",
  # The Boost Software License, carried by `xxhash-rust`, the hash of `notify` 9's polling
  # watcher. As permissive as MIT and lighter: use, modify and redistribute, in a
  # closed program too; the text kept only with the library's source, nothing asked of a
  # binary. OSI and FSF approved. Not the Business Source License (BUSL), which is not open.
  "BSL-1.0",
  # The yaxpeax crates (the AArch64 decoder of SPEC 05 §1.6). 0BSD is the BSD licence with
  # the attribution clause removed: use it for anything, no notice required. The OSI and the
  # FSF both list it as free, and it is the most permissive licence there is — there is
  # nothing in it to carry into the binary at all, and `THIRD-PARTY.md` names them anyway.
  "0BSD",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
# No copyleft in the default feature set.
deny = []

[advisories]
yanked = "deny"
# Advisories we carry knowingly, each with a reason and a way out.
ignore = [
  # RUSTSEC-2026-0543: chrono is unmaintained — no vulnerability, its author wound it down
  # and recommends jiff (chronotope/chrono#1768). Our own dates, suppaftp and trash are on jiff
  # since 0.44.2; what still brings chrono is russh-sftp (3.0.1, its file times), the netbox's
  # SFTP client. It goes when russh-sftp moves off chrono.
  { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained, no vulnerability; being replaced by jiff" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
