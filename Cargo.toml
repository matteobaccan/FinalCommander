[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.3"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/matteobaccan/SupremeCommander"
authors = ["Matteo Baccan and the SupremeCommander contributors"]

[workspace.dependencies]
scmd-core = { path = "crates/scmd-core", version = "0.0.3" }
scmd-vfs = { path = "crates/scmd-vfs", version = "0.0.3" }
scmd-config = { path = "crates/scmd-config", version = "0.0.3" }
scmd-cmd = { path = "crates/scmd-cmd", version = "0.0.3" }
scmd-i18n = { path = "crates/scmd-i18n", version = "0.0.3" }
scmd-ui = { path = "crates/scmd-ui", version = "0.0.3" }
scmd-tui = { path = "crates/scmd-tui", version = "0.0.3" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
