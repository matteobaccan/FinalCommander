[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/matteobaccan/SupremeCommander"
authors = ["Matteo Baccan and the SupremeCommander contributors"]

[workspace.dependencies]
sc-core = { path = "crates/sc-core", version = "0.1.0" }
sc-vfs = { path = "crates/sc-vfs", version = "0.1.0" }
sc-config = { path = "crates/sc-config", version = "0.1.0" }
sc-cmd = { path = "crates/sc-cmd", version = "0.1.0" }
sc-i18n = { path = "crates/sc-i18n", version = "0.1.0" }
sc-ui = { path = "crates/sc-ui", version = "0.1.0" }
sc-tui = { path = "crates/sc-tui", version = "0.1.0" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
