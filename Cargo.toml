[workspace]
resolver = "2"
members = ["crates/*"]
# The workspace holds two binaries — the program and the site generator — and `cargo run` has
# to mean the program. Without this it refuses, naming both, and every `cargo run -- --…` in
# CONTRIBUTING.md and in CI would have to say which. The explicit `--workspace` that the test,
# clippy and licence runs pass is unaffected: this only decides what a bare command defaults to.
default-members = ["crates/fcmd"]

[workspace.package]
version = "0.26.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/matteobaccan/FinalCommander"
authors = ["Matteo Baccan and the FinalCommander contributors"]

[workspace.dependencies]
# Every crate of this workspace, declared once. A crate depends on another with
# `fcmd-core = { workspace = true }`, never by spelling out a path and a version of its own:
# cutting a release is then the one `version` above, and not a version in twenty manifests
# that a build only notices when one of them is left behind. There is deliberately no
# `version` here — nothing is published to crates.io, and a path is all a workspace needs.
fcmd = { path = "crates/fcmd" }
fcmd-arc = { path = "crates/fcmd-arc" }
fcmd-cmd = { path = "crates/fcmd-cmd" }
fcmd-config = { path = "crates/fcmd-config" }
fcmd-core = { path = "crates/fcmd-core" }
fcmd-edit = { path = "crates/fcmd-edit" }
fcmd-find = { path = "crates/fcmd-find" }
fcmd-i18n = { path = "crates/fcmd-i18n" }
fcmd-jobs = { path = "crates/fcmd-jobs" }
fcmd-net = { path = "crates/fcmd-net" }
fcmd-platform = { path = "crates/fcmd-platform" }
fcmd-plug = { path = "crates/fcmd-plug" }
fcmd-s3 = { path = "crates/fcmd-s3" }
fcmd-syntax = { path = "crates/fcmd-syntax" }
fcmd-term = { path = "crates/fcmd-term" }
fcmd-tui = { path = "crates/fcmd-tui" }
fcmd-ui = { path = "crates/fcmd-ui" }
fcmd-vfs = { path = "crates/fcmd-vfs" }
fcmd-view = { path = "crates/fcmd-view" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
