[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/matteobaccan/SupremeCommander"
authors = ["Matteo Baccan and the SupremeCommander contributors"]

[workspace.dependencies]
# Every crate of this workspace, declared once. A crate depends on another with
# `scmd-core = { workspace = true }`, never by spelling out a path and a version of its own:
# cutting a release is then the one `version` above, and not a version in twenty manifests
# that a build only notices when one of them is left behind. There is deliberately no
# `version` here — nothing is published to crates.io, and a path is all a workspace needs.
scmd = { path = "crates/scmd" }
scmd-arc = { path = "crates/scmd-arc" }
scmd-cmd = { path = "crates/scmd-cmd" }
scmd-config = { path = "crates/scmd-config" }
scmd-core = { path = "crates/scmd-core" }
scmd-edit = { path = "crates/scmd-edit" }
scmd-find = { path = "crates/scmd-find" }
scmd-i18n = { path = "crates/scmd-i18n" }
scmd-jobs = { path = "crates/scmd-jobs" }
scmd-net = { path = "crates/scmd-net" }
scmd-plug = { path = "crates/scmd-plug" }
scmd-s3 = { path = "crates/scmd-s3" }
scmd-syntax = { path = "crates/scmd-syntax" }
scmd-term = { path = "crates/scmd-term" }
scmd-tui = { path = "crates/scmd-tui" }
scmd-ui = { path = "crates/scmd-ui" }
scmd-vfs = { path = "crates/scmd-vfs" }
scmd-view = { path = "crates/scmd-view" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
