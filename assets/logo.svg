<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 236" width="880" height="236" role="img" aria-label="SupremeCommander: an orthodox file manager for the terminal — one binary, every system">
<title>SupremeCommander</title><desc>Two panels in FAR Manager's own palette. The cursor walks down the left panel while the right one counts off the systems one binary runs on: linux, macos, windows.</desc>
<style>
  text { font-family: ui-monospace,'DejaVu Sans Mono','Cascadia Mono','Courier New',monospace; white-space: pre; }
  /* The cursor bar walks four rows and starts again. */
  @keyframes walk {
    0%,   18% { transform: translateY(0px); }
    25%,  43% { transform: translateY(22px); }
    50%,  68% { transform: translateY(44px); }
    75%,  93% { transform: translateY(66px); }
    100%      { transform: translateY(0px); }
  }
  #cursor { animation: walk 8s linear infinite; }
  /* Each row keeps its own ink, except while the bar is under it: then it is black, as it
     is on the screen the program draws. One text per row, one keyframe for all of them —
     each row carries its colour in `--c`. */
  .row { animation: ink 8s linear infinite; }
  @keyframes ink { 0%, 18% { fill: #000000; } 19%, 100% { fill: var(--c); } }
  #row2 { animation-delay: -6s; }
  #row3 { animation-delay: -4s; }
  #row4 { animation-delay: -2s; }
  /* The systems arrive one after another and stay. */
  .sys { opacity: 0; animation: arrive 8s ease-out infinite; }
  @keyframes arrive {
    0%, 8%  { opacity: 0; transform: translateX(6px); }
    16%,92% { opacity: 1; transform: translateX(0); }
    100%    { opacity: 0; transform: translateX(6px); }
  }
  #sys1 { animation-delay: 0.2s; }
  #sys2 { animation-delay: 1.2s; }
  #sys3 { animation-delay: 2.2s; }
  #one  { opacity: 0; animation: arrive 8s ease-out 3.4s infinite; }
  /* The command line's block cursor. */
  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  #caret { animation: blink 1.1s steps(2, jump-none) infinite; }
  /* Someone who has asked for less movement gets the same picture, standing still. */
  @media (prefers-reduced-motion: reduce) {
    #cursor, .row, .sys, #one, #caret { animation: none; }
    .row { fill: var(--c); }
    #row1 { fill: #000000; }
    .sys, #one { opacity: 1; }
  }
</style>
<rect x="0" y="0" width="880" height="236" rx="10" fill="#000000"/>
<rect x="1.5" y="1.5" width="877" height="233" rx="9" fill="none" stroke="#008080" stroke-width="3"/>
<rect x="8" y="8" width="864" height="24" fill="#008080"/>
<text x="20" y="25" fill="#000000" font-size="16" font-weight="normal" textLength="451.0" lengthAdjust="spacingAndGlyphs">Left   Files   Commands   Options   Right</text>
<rect x="14" y="44" width="414" height="148" fill="#000080" stroke="#00ffff" stroke-width="2"/><rect x="89.0" y="33" width="264.0" height="22" fill="#008080"/><text x="89.0" y="49" fill="#000000" font-size="17" font-weight="normal" textLength="264.0" lengthAdjust="spacingAndGlyphs"> ~/src/supremecommander </text>
<rect x="452" y="44" width="414" height="148" fill="#000080" stroke="#00ffff" stroke-width="2"/><rect x="604.0" y="33" width="110.0" height="22" fill="#000080"/><text x="604.0" y="49" fill="#00ffff" font-size="17" font-weight="normal" textLength="110.0" lengthAdjust="spacingAndGlyphs"> portable </text>
<g id="cursor"><rect x="18" y="62" width="406" height="22" fill="#008080"/></g>
<text x="26" y="78" fill="#ffffff" font-size="17" font-weight="normal" textLength="22.0" lengthAdjust="spacingAndGlyphs" class="row" id="row1" style="--c:#ffffff">..</text>
<text x="26" y="100" fill="#ffffff" font-size="17" font-weight="normal" textLength="66.0" lengthAdjust="spacingAndGlyphs" class="row" id="row2" style="--c:#ffffff">crates</text>
<text x="26" y="122" fill="#ffffff" font-size="17" font-weight="normal" textLength="44.0" lengthAdjust="spacingAndGlyphs" class="row" id="row3" style="--c:#ffffff">docs</text>
<text x="26" y="144" fill="#00ffff" font-size="17" font-weight="normal" textLength="110.0" lengthAdjust="spacingAndGlyphs" class="row" id="row4" style="--c:#00ffff">Cargo.toml</text>
<text x="26" y="166" fill="#00ffff" font-size="17" font-weight="normal" textLength="99.0" lengthAdjust="spacingAndGlyphs">README.md</text>
<text x="26" y="188" fill="#00ffff" font-size="17" font-weight="normal" textLength="132.0" lengthAdjust="spacingAndGlyphs">CHANGELOG.md</text>
<g class="sys" id="sys1"><polyline points="466,72 471,77 479,66" fill="none" stroke="#00ff00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="492" y="78" fill="#00ffff" font-size="17" font-weight="normal" textLength="55.0" lengthAdjust="spacingAndGlyphs">linux</text><text x="602" y="78" fill="#c0c0c0" font-size="15" font-weight="normal" textLength="143.0" lengthAdjust="spacingAndGlyphs">x86-64 · musl</text></g>
<g class="sys" id="sys2"><polyline points="466,94 471,99 479,88" fill="none" stroke="#00ff00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="492" y="100" fill="#00ffff" font-size="17" font-weight="normal" textLength="55.0" lengthAdjust="spacingAndGlyphs">macos</text><text x="602" y="100" fill="#c0c0c0" font-size="15" font-weight="normal" textLength="143.0" lengthAdjust="spacingAndGlyphs">intel · apple</text></g>
<g class="sys" id="sys3"><polyline points="466,116 471,121 479,110" fill="none" stroke="#00ff00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="492" y="122" fill="#00ffff" font-size="17" font-weight="normal" textLength="77.0" lengthAdjust="spacingAndGlyphs">windows</text><text x="602" y="122" fill="#c0c0c0" font-size="15" font-weight="normal" textLength="66.0" lengthAdjust="spacingAndGlyphs">x86-64</text></g>
<g id="one"><rect x="466" y="130" width="386" height="1" fill="#00ffff" opacity="0.45"/><text x="466" y="154" fill="#ffff00" font-size="17" font-weight="bold" textLength="121.0" lengthAdjust="spacingAndGlyphs">one program</text><text x="466" y="176" fill="#ffff00" font-size="17" font-weight="bold" textLength="132.0" lengthAdjust="spacingAndGlyphs">every system</text></g>
<text x="16" y="220" fill="#00ffff" font-size="17" font-weight="normal" textLength="253.0" lengthAdjust="spacingAndGlyphs">~/src/supremecommander></text>
<text x="280.0" y="220" fill="#ffffff" font-size="17" font-weight="normal" textLength="44.0" lengthAdjust="spacingAndGlyphs">scmd</text>
<rect id="caret" x="324.0" y="205" width="11.0" height="19" fill="#ffff00"/>
</svg>
