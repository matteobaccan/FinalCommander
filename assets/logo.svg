<svg xmlns="http://www.w3.org/2000/svg" width="880" height="236" aria-label="FinalCommander: an orthodox file manager for the terminal — one binary, every system" role="img" viewBox="0 0 880 236"><title>FinalCommander</title><desc>Two panels in FAR Manager&apos;s own palette. The cursor walks down the left panel while the right one counts off the systems one binary runs on: linux, macos, windows.</desc><style>@keyframes walk{0%,18%{transform:translateY(0)}25%,43%{transform:translateY(22px)}50%,68%{transform:translateY(44px)}75%,93%{transform:translateY(66px)}}@keyframes ink{0%,18%{fill:#000}19%{fill:var(--c)}}@keyframes arrive{0%,8%{opacity:0;transform:translateX(6px)}16%,92%{opacity:1;transform:translateX(0)}}@keyframes blink{0%,49%{opacity:1}50%{opacity:0}}text{font-family:ui-monospace,&apos;DejaVu Sans Mono&apos;,&apos;Cascadia Mono&apos;,&apos;Courier New&apos;,monospace;white-space:pre}#cursor{animation:walk 8s linear infinite}.row{animation:ink 8s linear infinite}#row2{animation-delay:-6s}#row3{animation-delay:-4s}#row4{animation-delay:-2s}.sys{opacity:0;animation:arrive 8s ease-out infinite}#sys1{animation-delay:.2s}#sys2{animation-delay:1.2s}#sys3{animation-delay:2.2s}#one{opacity:0;animation:arrive 8s ease-out 3.4s infinite}#caret{animation:blink 1.1s steps(2,jump-none) infinite}@media (prefers-reduced-motion:reduce){#caret,#cursor,#one,.row,.sys{animation:none}.row{fill:var(--c)}#row1{fill:#000}#one,.sys{opacity:1}}</style><rect width="880" height="236" x="0" y="0" fill="#000" rx="10"/><rect width="877" height="233" x="1.5" y="1.5" fill="none" stroke="teal" stroke-width="3" rx="9"/><rect width="864" height="24" x="8" y="8" fill="teal"/><text x="20" y="25" fill="#000" font-size="16" font-weight="normal" lengthAdjust="spacingAndGlyphs" textLength="451">Left Files Commands Options Right</text><rect width="414" height="148" x="14" y="44" fill="navy" stroke="#0ff" stroke-width="2"/><rect width="242" height="22" x="100" y="33" fill="teal"/><text x="100" y="49" fill="#000" font-size="17" font-weight="normal" lengthAdjust="spacingAndGlyphs" textLength="242">~/src/finalcommander</text><rect width="414" height="148" x="452" y="44" fill="navy" stroke="#0ff" stroke-width="2"/><rect width="110" height="22" x="604" y="33" fill="navy"/><text x="604" y="49" fill="#0ff" font-size="17" font-weight="normal" lengthAdjust="spacingAndGlyphs" textLength="110">portable</text><g id="cursor"><rect width="406" height="22" x="18" y="62" fill="teal"/></g><text id="row1" x="26" y="78" fill="#fff" class="row" font-size="17" font-weight="normal" lengthAdjust="spacingAndGlyphs" textLength="22" style="--c:#ffffff">..</text><text id="row2" x="26" y="100" fill="#fff" class="row" font-size="17" font-weight="normal" lengthAdjust="spacingAndGlyphs" textLength="66" style="--c:#ffffff">crates</text><text id="row3" x="26" y="122" fill="#fff" class="row" font-size="17" font-weight="normal" lengthAdjust="spacingAndGlyphs" textLength="44" style="--c:#ffffff">docs</text><text id="row4" x="26" y="144" fill="#0ff" class="row" font-size="17" font-weight="normal" lengthAdjust="spacingAndGlyphs" textLength="110" style="--c:#00ffff">Cargo.toml</text><text x="26" y="166" fill="#0ff" font-size="17" font-weight="normal" lengthAdjust="spacingAndGlyphs" textLength="99">README.md</text><text x="26" y="188" fill="#0ff" font-size="17" font-weight="normal" lengthAdjust="spacingAndGlyphs" textLength="132">CHANGELOG.md</text><g id="sys1" class="sys"><polyline fill="none" stroke="#0f0" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" points="466 72 471 77 479 66"/><text x="492" y="78" fill="#0ff" font-size="17" font-weight="normal" lengthAdjust="spacingAndGlyphs" textLength="55">linux</text><text x="602" y="78" fill="silver" font-size="15" font-weight="normal" lengthAdjust="spacingAndGlyphs" textLength="143">x86-64 · musl</text></g><g id="sys2" class="sys"><polyline fill="none" stroke="#0f0" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" points="466 94 471 99 479 88"/><text x="492" y="100" fill="#0ff" font-size="17" font-weight="normal" lengthAdjust="spacingAndGlyphs" textLength="55">macos</text><text x="602" y="100" fill="silver" font-size="15" font-weight="normal" lengthAdjust="spacingAndGlyphs" textLength="143">intel · apple</text></g><g id="sys3" class="sys"><polyline fill="none" stroke="#0f0" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" points="466 116 471 121 479 110"/><text x="492" y="122" fill="#0ff" font-size="17" font-weight="normal" lengthAdjust="spacingAndGlyphs" textLength="77">windows</text><text x="602" y="122" fill="silver" font-size="15" font-weight="normal" lengthAdjust="spacingAndGlyphs" textLength="66">x86-64</text></g><g id="one"><rect width="386" height="1" x="466" y="130" fill="#0ff" opacity=".45"/><text x="466" y="154" fill="#ff0" font-size="17" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="121">one program</text><text x="466" y="176" fill="#ff0" font-size="17" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="132">every system</text></g><text x="16" y="220" fill="#0ff" font-size="17" font-weight="normal" lengthAdjust="spacingAndGlyphs" textLength="231">~/src/finalcommander&gt;</text><text x="280" y="220" fill="#fff" font-size="17" font-weight="normal" lengthAdjust="spacingAndGlyphs" textLength="44">fcmd</text><rect id="caret" width="11" height="19" x="324" y="205" fill="#ff0"/></svg>