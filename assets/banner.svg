<text x="734" y="210" fill="#ffffff" font-size="24" font-weight="normal" textLength="84" lengthAdjust="spacingAndGlyphs">crates</text>
<text x="734" y="244" fill="#ffffff" font-size="24" font-weight="normal" textLength="56" lengthAdjust="spacingAndGlyphs">docs</text>
