<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" aria-label="FinalCommander — an orthodox file manager for the terminal. One program, every system." role="img" viewBox="0 0 1280 640"><title>FinalCommander</title><style>text{font-family:ui-monospace,&apos;DejaVu Sans Mono&apos;,&apos;Cascadia Mono&apos;,&apos;Courier New&apos;,monospace;white-space:pre}</style><rect width="1280" height="640" fill="#000"/><rect width="1280" height="8" x="0" y="0" fill="teal"/><rect width="1280" height="8" x="0" y="632" fill="teal"/><text x="78" y="186" fill="#fff" font-size="64" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="190">Final</text><text x="268" y="186" fill="#0ff" font-size="64" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="342">Commander</text><rect width="608" height="3" x="78" y="208" fill="teal"/><text x="78" y="252" fill="#0ff" font-size="25" font-weight="normal" lengthAdjust="spacingAndGlyphs" textLength="615">an orthodox file manager for the terminal</text><text x="78" y="338" fill="#ff0" font-size="38" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="264">one program.</text><text x="364" y="338" fill="#ff0" font-size="38" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="286">every system.</text><text x="78" y="384" fill="#9aa0a6" font-size="20" font-weight="normal" lengthAdjust="spacingAndGlyphs" textLength="576">the shape Norton Commander gave the terminal and</text><text x="78" y="410" fill="#9aa0a6" font-size="20" font-weight="normal" lengthAdjust="spacingAndGlyphs" textLength="576">the keys FAR kept, in one program that works the</text><text x="78" y="436" fill="#9aa0a6" font-size="20" font-weight="normal" lengthAdjust="spacingAndGlyphs" textLength="564">same way on systems its ancestors never shared.</text><polyline fill="none" stroke="#0f0" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" points="80 476 86 482 97 468"/><text x="112" y="482" fill="#0ff" font-size="24" f