<text x="1024" y="210" fill="#00ffff" font-size="24" font-weight="normal" textLength="70" lengthAdjust="spacingAndGlyphs">macos</text>
<polyline points="992,238 998,244 1009,230" fill="none" stroke="#00ff00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1024" y="244" fill="#00ffff" font-size="24" font-weight="normal" textLength="98" lengthAdjust="spacingAndGlyphs">windows</text>
