<rect x="0.0" y="198.0" width="840.0" height="18" fill="#000080"/>
<text xml:space="preserve" x="67.2 75.6 84.0 92.4 100.8 109.2 117.6 126.0 134.4 142.8 151.2 159.6 168.0 176.4 184.8 193.2 201.6 210.0 218.4 226.8 235.2 243.6 252.0 260.4 268.8 277.2 285.6 294.0 302.4 310.8 319.2 327.6 336.0 344.4 352.8 361.2 369.6 378.0 386.4 394.8 403.2 411.6 420.0 428.4 436.8 445.2 453.6 462.0 470.4 478.8 487.2 495.6 504.0 512.4 520.8 529.2 537.6 546.0 554.4 562.8 571.2 579.6 588.0 596.4 604.8 613.2 621.6 630.0 638.4 646.8 655.2" y="211.6" fill="#00ffff">// One name is the other with more after it, or they are the same name.</text>
<rect x="0.0" y="216.0" width="840.0" height="18" fill="#000080"/>
<text xml:space="preserve" x="67.2 75.6 84.0 92.4 100.8 109.2 117.6 126.0 134.4 142.8 151.2 159.6 168.0 176.4 184.8 193.2 201.6 210.0 218.4 226.8 235.2 243.6 252.0 260.4 268.8 277.2 285.6 294.0 302.4" y="229.6" fill="#00ffff">return a.len().cmp(&amp;b.len());</text>
<rect x="0.0" y="234.0" width="840.0" height="18" fill="#000080"/>
<text xml:space="preserve" x="33.6" y="247.6" fill="#00ffff">}</text>
<rect x="0.0" y="252.0" width="840.0" height="18" fill="#000080"/>
<text xml:space="preserve" x="33.6 42.0 50.4 58.8 67.2 75.6 84.0 92.4 100.8 109.2 117.6 126.0 134.4 142.8 151.2 159.6 168.0 176.4 184.8 193.2 201.6 210.0 218.4 226.8 235.2 243.6 252.0 260.4 268.8 277.2 285.6 294.0 302.4 310.8 319.2 327.6 336.0 344.4 352.8 361.2 369.6 378.0" y="265.6" fill="#00ffff">while i &gt; 0 &amp;&amp; a[i - 1].is_ascii_digit() {</text>
<rect x="0.0" y="270.0" width="840.0" height="18" fill="#000080"/>
