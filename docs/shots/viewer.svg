<text xml:space="preserve" x="0.0 8.4 16.8 25.2 33.6 42.0 50.4 58.8 67.2 75.6 84.0 92.4 100.8 109.2 117.6 126.0 134.4 142.8 151.2 159.6 168.0 176.4 184.8 193.2 201.6 210.0 218.4 226.8 235.2 243.6 252.0 260.4 268.8 277.2 285.6 294.0 302.4 310.8 319.2 327.6 336.0 344.4 352.8 361.2 369.6 378.0 386.4 394.8 403.2 411.6 420.0 428.4 436.8 445.2 453.6 462.0 470.4 478.8 487.2 495.6 504.0 512.4 520.8 529.2 537.6 546.0 554.4 562.8 571.2 579.6 588.0 596.4 604.8 613.2 621.6 630.0 638.4 646.8 655.2 663.6" y="67.6" fill="#00ffff">/// The same comparison on the bytes of a name, which is how a listing holds it.</text>
<rect x="0.0" y="72.0" width="840.0" height="18" fill="#000080"/>
<text xml:space="preserve" x="0.0 8.4 16.8 25.2 33.6 42.0 50.4 58.8 67.2 75.6 84.0 92.4 100.8 109.2 117.6 126.0 134.4 142.8 151.2 159.6 168.0 176.4 184.8 193.2 201.6 210.0 218.4 226.8 235.2 243.6 252.0 260.4 268.8 277.2 285.6 294.0 302.4 310.8 319.2 327.6 336.0 344.4 352.8 361.2 369.6 378.0 386.4 394.8 403.2 411.6 420.0 428.4 436.8 445.2 453.6 462.0 470.4 478.8 487.2 495.6 504.0 512.4 520.8 529.2 537.6 546.0 554.4 562.8 571.2 579.6 588.0 596.4 604.8 613.2 621.6 630.0 638.4 646.8 655.2 663.6" y="85.6" fill="#00ffff">pub fn natural_cmp_bytes(a: &amp;[u8], b: &amp;[u8], case_sensitive: bool) -&gt; Ordering {</text>
<rect x="0.0" y="90.0" width="840.0" height="18" fill="#000080"/>
<text xml:space="preserve" x="33.6 42.0 50.4 58.8 67.2 75.6 84.0 92.4 100.8 109.2 117.6 126.0 134.4 142.8 151.2 159.6 168.0 176.4 184.8 193.2 201.6 210.0 218.4 226.8 235.2 243.6 252.0 260.4 268.8 277.2 285.6 294.0 302.4 310.8" y="103.6" fill="#00ffff">let common = a.len().min(b.len());</text>
<rect x="0.0" y="108.0" width="840.0" height="18" fill="#000080"/>
<text xml:space="preserve" x="33.6 42.0 50.4 58.8 67.2 75.6 84.0 92.4 100.8 109.2 117.6 126.0 134.4 142.8" y="121.6" fill="#00ffff">let mut i = 0;</text>
<rect x="0.0" y="126.0" width="840.0" height="18" fill="#000080"/>
<text xml:space="preserve" x="33.6 42.0 50.4 58.8 67.2 75.6 84.0 92.4 100.8 109.2 117.6 126.0 134.4 142.8 151.2 159.6 168.0 176.4 184.8 193.2 201.6 210.0 218.4 226.8 235.2 243.6 252.0 260.4 268.8 277.2 285.6 294.0 302.4 310.8" y="139.6" fill="#00ffff">while i &lt; common &amp;&amp; a[i] == b[i] {</text>
<rect x="0.0" y="144.0" width="840.0" height="18" fill="#000080"/>
<text xml:space="preserve" x="67.2 75.6 84.0 92.4 100.8 109.2 117.6" y="157.6" fill="#00ffff">i += 1;</text>
<rect x="0.0" y="162.0" width="840.0" height="18" fill="#000080"/>
<text xml:space="preserve" x="33.6" y="175.6" fill="#00ffff">}</text>
<rect x="0.0" y="180.0" width="840.0" height="18" fill="#000080"/>
